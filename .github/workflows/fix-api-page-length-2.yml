name: Fix API page length error 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden API page array handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/IntegrationLogs.jsx')
          s = p.read_text()
          s = s.replace('  const providers = Array.isArray(providerOptions) ? providerOptions : []\n', '  const providers = Array.isArray(providerOptions) ? providerOptions : []\n  const safeLogs = Array.isArray(logs) ? logs : []\n  const safeChartLogs = Array.isArray(chartLogs) ? chartLogs : []\n')
          s = s.replace('    chartLogs.forEach((log) => {', '    safeChartLogs.forEach((log) => {')
          s = s.replace('  }, [chartLogs])', '  }, [safeChartLogs])')
          s = s.replace('!logs.length ? <div className="integration-logs-empty">No integration events found.</div> : <div className="integration-logs-table-wrap">', '!safeLogs.length ? <div className="integration-logs-empty">No integration events found.</div> : <div className="integration-logs-table-wrap">')
          s = s.replace('{logs.map(log => {', '{safeLogs.map(log => {')
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/IntegrationLogs.jsx .github/workflows/fix-api-page-length-2.yml
          git commit -m "Harden API page array handling" || exit 0
          git rm .github/workflows/fix-api-page-length-2.yml
          git commit -m "Remove temporary API page fix workflow"
          git push