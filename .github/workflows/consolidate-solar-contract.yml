name: Consolidate solar contract renderer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-solar-contract.yml'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.head_commit.message != 'chore: consolidate solar contract renderer [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consolidate renderer
        run: |
          cp src/contracts/GenerateSolarContractLegacy.js src/contracts/GenerateSolarContract.js
          rm src/contracts/GenerateSolarContractLegacy.js
          rm .github/workflows/consolidate-solar-contract.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contracts/GenerateSolarContract.js src/contracts/GenerateSolarContractLegacy.js .github/workflows/consolidate-solar-contract.yml
          git commit -m 'chore: consolidate solar contract renderer [skip ci]'
          git push
