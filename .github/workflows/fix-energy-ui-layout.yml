name: Fix Energy UI layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Energy card layout
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          # Add optional label styling to Input without changing existing callers.
          old_input_signature = '''function Input({
  label,
  value,
  onChange,
  type = "text",
  step,
  min,
  max,
  disabled = false,
  readOnly = false,
}) {'''
          new_input_signature = '''function Input({
  label,
  value,
  onChange,
  type = "text",
  step,
  min,
  max,
  disabled = false,
  readOnly = false,
  labelStyle,
}) {'''
          if old_input_signature in text and '  labelStyle,\n}) {' not in text:
              text = text.replace(old_input_signature, new_input_signature, 1)

          old_label = '''      <span>{label}</span>'''
          new_label = '''      <span style={labelStyle}>{label}</span>'''
          if old_label in text and '<span style={labelStyle}>{label}</span>' not in text:
              text = text.replace(old_label, new_label, 1)

          # Make the electricity inputs compact and remove the redundant "Current" wording.
          text = text.replace('''                <div style={styles.grid}>
                  <Input
                    label="Annual electricity consumption (kWh)"''', '''                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "repeat(4, minmax(0, 1fr))",
                    gap: 12,
                  }}
                >
                  <Input
                    label="Annual electricity consumption (kWh)"
                    labelStyle={{ fontSize: 12, fontWeight: 600, color: "#172554" }}''', 1)

          text = text.replace('''                  <Input
                    label="Current import rate (p/kWh)"''', '''                  <Input
                    label="Import rate (p/kWh)"
                    labelStyle={{ fontSize: 12, fontWeight: 600, color: "#172554" }}''', 1)
          text = text.replace('''                  <Input
                    label="Current export rate (p/kWh)"''', '''                  <Input
                    label="Export rate (p/kWh)"
                    labelStyle={{ fontSize: 12, fontWeight: 600, color: "#172554" }}''', 1)
          text = text.replace('''                  <Input
                    label="Current standing charge (p/day)"''', '''                  <Input
                    label="Standing charge (p/day)"
                    labelStyle={{ fontSize: 12, fontWeight: 600, color: "#172554" }}''', 1)

          # Put the Existing solar PV toggle directly into its section header.
          old_existing_header = '''              <div
                style={{
                  padding: "12px 14px",
                  background: "#f8fafc",
                  borderTop: "1px solid #dbe3ec",
                  borderBottom: "1px solid #dbe3ec",
                  color: "#172554",
                  fontSize: 13,
                  fontWeight: 700,
                }}
              >
                Existing solar PV
              </div>

              <div style={{ padding: 14 }}>
                <div style={styles.grid}>
                  <Toggle
                    label="Existing solar PV"
                    value={data.existingSolar}
                    onChange={(value) => update("existingSolar", value)}
                  />
                  {data.existingSolar && (
                    <Input
                      label="Existing annual generation (kWh)"
                      type="number"
                      value={data.existingGeneration}
                      onChange={(value) => update("existingGeneration", value)}
                      min={0}
                    />
                  )}
                  {data.existingSolar && (
                    <Input
                      label="Existing solar self-consumption (%)"
                      type="number"
                      value={data.existingSolarSelfConsumption}
                      onChange={(value) => update("existingSolarSelfConsumption", value)}
                      min={0}
                      max={100}
                      step={1}
                    />
                  )}
                </div>
              </div>'''

          new_existing_header = '''              <div
                style={{
                  padding: "10px 14px",
                  background: "#f8fafc",
                  borderTop: "1px solid #dbe3ec",
                  borderBottom: "1px solid #dbe3ec",
                  color: "#172554",
                  fontSize: 13,
                  fontWeight: 700,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                }}
              >
                <span>Existing solar PV</span>
                <button
                  type="button"
                  aria-label="Existing solar PV"
                  onClick={() => update("existingSolar", !data.existingSolar)}
                  style={{
                    ...styles.toggle,
                    background: data.existingSolar ? "#172554" : "#d1d5db",
                    flexShrink: 0,
                  }}
                >
                  <span
                    style={{
                      ...styles.toggleKnob,
                      transform: data.existingSolar
                        ? "translateX(20px)"
                        : "translateX(0)",
                    }}
                  />
                </button>
              </div>

              <div style={{ padding: 14 }}>
                {data.existingSolar && (
                  <div
                    style={{
                      display: "grid",
                      gridTemplateColumns: "repeat(2, minmax(0, 1fr))",
                      gap: 12,
                    }}
                  >
                    <Input
                      label="Annual generation (kWh)"
                      labelStyle={{ fontSize: 12, fontWeight: 600, color: "#172554" }}
                      type="number"
                      value={data.existingGeneration}
                      onChange={(value) => update("existingGeneration", value)}
                      min={0}
                    />
                    <Input
                      label="Self-consumption (%)"
                      labelStyle={{ fontSize: 12, fontWeight: 600, color: "#172554" }}
                      type="number"
                      value={data.existingSolarSelfConsumption}
                      onChange={(value) => update("existingSolarSelfConsumption", value)}
                      min={0}
                      max={100}
                      step={1}
                    />
                  </div>
                )}
              </div>'''

          if old_existing_header not in text:
              raise SystemExit('Existing solar UI block not found')
          text = text.replace(old_existing_header, new_existing_header, 1)

          path.write_text(text)

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx
          git rm .github/workflows/fix-energy-ui-layout.yml
          git commit -m "Tidy Energy card input layout"
          git push
