name: Fix Octopus card JSX structure

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair missing closing div
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/EPVSCalculator.jsx")
          text = path.read_text(encoding="utf-8")

          tariff_start = text.find("{/* =================================================\n            TARIFF")
          finance_start = text.find("{/* =================================================\n            FINANCE", tariff_start)

          if tariff_start == -1 or finance_start == -1:
              raise SystemExit("Could not locate tariff/finance sections")

          tariff = text[tariff_start:finance_start]
          target = "            </div>\n          </Card>\n\n"

          if target not in tariff:
              raise SystemExit("Could not locate the malformed tariff card ending")

          # The tariff card has an outer wrapper around the rate content and an
          # inner wrapper around the table. The previous edit only closed the
          # inner wrapper before </Card>, leaving the outer div open.
          replacement = "            </div>\n            </div>\n          </Card>\n\n"
          tariff = tariff.replace(target, replacement, 1)
          text = text[:tariff_start] + tariff + text[finance_start:]
          path.write_text(text, encoding="utf-8")

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-build-structure.yml
          git add src/EPVSCalculator.jsx
          git commit -m "Fix Octopus card JSX structure"
          git push origin main
