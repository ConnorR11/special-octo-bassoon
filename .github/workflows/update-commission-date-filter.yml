name: Update commission date filter

on:
  push:
    paths:
      - '.github/workflows/update-commission-date-filter.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Sales Commission date filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/SalesCommission.jsx')
          s = p.read_text()
          old_query = '.gte("sale_date", "2025-01-01")'
          new_query = '.gte("sale_date", "2026-01-01")'
          if old_query not in s:
              raise SystemExit('Expected 2025 admin query filter not found')
          s = s.replace(old_query, new_query, 1)
          old_combined = 'deals.filter(deal => getNetSalesValue(deal) !== 0 && !isExcludedCommissionStage(deal))'
          new_combined = 'deals.filter(deal => getNetSalesValue(deal) !== 0 && !isExcludedCommissionStage(deal) && String(deal?.sale_date || "").slice(0, 10) >= "2026-01-01")'
          if old_combined not in s:
              raise SystemExit('Expected COMMS combined filter not found')
          s = s.replace(old_combined, new_combined, 1)
          p.write_text(s)
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-commission-date-filter.yml
          git add src/pages/SalesCommission.jsx
          git commit -m "Filter Sales Commissions to 2026 onwards"
          git push
