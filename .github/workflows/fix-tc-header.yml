name: Fix T&C header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tc-header.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'chore: fix T&C header [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix duplicate T&C header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/contracts/GenerateSolarContract.js')
          text = path.read_text()

          text = text.replace(
              'if(kind!=="terms_conditions")title(pdf,page,c);',
              'title(pdf,page,c);'
          )

          pattern = r'function drawTermsConditions\(pdf,page,c,a,e\)\{.*?\n\nasync function renderPage'
          replacement = '''function drawTermsConditions(pdf,page,c,a,e){const s=page.settings||{},w=c.width-c.padding*2,gap=Number(s.column_gap_mm||6),cw=(w-gap)/2,top=c.y+28,bottom=c.height-17,available=bottom-top;let fs=Number(s.font_size||6.5),lh=Number(s.line_height||3.1);const spacing=Number(s.section_spacing||2),heading=Number(s.heading_font_size||7);const sections=parseTermsSections(interpolate(String(page.body||""),a,e));let lines=buildTermsLines(pdf,sections,cw,fs,heading,spacing);for(let i=0;i<12;i++){const capacity=Math.floor(available/lh)*2,required=lines.reduce((n,l)=>n+(l.spacing?0:1),0);if(required<=capacity)break;fs=Math.max(5.15,fs*.96);lh=Math.max(2.35,lh*.96);lines=buildTermsLines(pdf,sections,cw,fs,heading,spacing)}let col=0,x=c.padding,y=top;for(const line of lines){if(col>1)break;if(line.spacing){if(y+line.spacing>bottom){col++;x=c.padding+cw+gap;y=top}else y+=line.spacing;continue}if(y+lh>bottom){col++;x=c.padding+cw+gap;y=top}if(col>1)break;pdf.setTextColor(...c.text);if(line.boldPrefix){pdf.setFont("helvetica","bold");pdf.setFontSize(heading);const pw=pdf.getTextWidth(line.boldPrefix);pdf.text(line.boldPrefix,x,y);pdf.setFont("helvetica","normal");pdf.setFontSize(fs);pdf.text(line.text,x+pw,y)}else{pdf.setFont("helvetica","normal");pdf.setFontSize(fs);pdf.text(line.text,x,y)}y+=lh}}

async function renderPage'''

          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate drawTermsConditions function')

          path.write_text(new_text)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-tc-header.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contracts/GenerateSolarContract.js .github/workflows/fix-tc-header.yml
          git commit -m 'chore: fix T&C header [skip ci]'
          git push
