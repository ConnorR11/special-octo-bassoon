name: Apply Sales Presenter Integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-sales-presenter-integration.yml'
      - '.github/patch-sales-presenter.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration
        run: python .github/patch-sales-presenter.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
