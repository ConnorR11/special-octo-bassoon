name: Update EPVS array display

on:
  push:
    paths:
      - '.github/epvs-array-table-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert array cards to table
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          start_marker = '            {/* ARRAYS */}'
          end_marker = '            {/* TOTAL */}'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit(f'Could not locate array section: start={start}, end={end}')

          replacement = r'''            {/* ARRAYS */}

            <div
              style={{
                overflowX: "auto",
                border: "1px solid #dbe3ec",
                borderRadius: 10,
                background: "#ffffff",
              }}
            >
              <table
                style={{
                  width: "100%",
                  minWidth: 1050,
                  borderCollapse: "collapse",
                  fontSize: 12,
                }}
              >
                <thead>
                  <tr style={{ background: "#f8fafc" }}>
                    {[
                      "Array",
                      "Panels",
                      "Panel Wp",
                      "Orientation (°)",
                      "Pitch (°)",
                      "Irradiance / Kk",
                      "SF",
                      "System size (kWp)",
                      "Generation (kWh)",
                    ].map((heading) => (
                      <th
                        key={heading}
                        style={{
                          padding: "11px 10px",
                          textAlign: "left",
                          fontSize: 10,
                          fontWeight: 700,
                          color: "#475569",
                          borderBottom: "1px solid #dbe3ec",
                          whiteSpace: "nowrap",
                        }}
                      >
                        {heading}
                      </th>
                    ))}
                  </tr>
                </thead>

                <tbody>
                  {data.arrays
                    .slice(0, data.numberOfArrays)
                    .map((array, index) => {
                      const calculated = results.arrays[index]

                      const cellInputStyle = {
                        width: "100%",
                        minWidth: 72,
                        boxSizing: "border-box",
                        padding: "8px 9px",
                        border: "1px solid #dbe3ec",
                        borderRadius: 7,
                        fontSize: 12,
                        background: "#ffffff",
                      }

                      return (
                        <tr key={index}>
                          <td
                            style={{
                              padding: "10px",
                              fontWeight: 700,
                              color: "#172554",
                              borderBottom: "1px solid #eef2f7",
                              whiteSpace: "nowrap",
                            }}
                          >
                            Array {index + 1}
                          </td>

                          <td style={{ padding: "10px", borderBottom: "1px solid #eef2f7" }}>
                            <input
                              type="number"
                              value={array.panelCount ?? ""}
                              min={1}
                              style={cellInputStyle}
                              onChange={(event) =>
                                updateArray(index, "panelCount", Number(event.target.value))
                              }
                            />
                          </td>

                          <td style={{ padding: "10px", borderBottom: "1px solid #eef2f7" }}>
                            <input
                              type="number"
                              value={array.panelWattage ?? ""}
                              min={1}
                              style={cellInputStyle}
                              onChange={(event) =>
                                updateArray(index, "panelWattage", Number(event.target.value))
                              }
                            />
                          </td>

                          <td style={{ padding: "10px", borderBottom: "1px solid #eef2f7" }}>
                            <input
                              type="number"
                              value={array.orientation ?? ""}
                              min={-180}
                              max={180}
                              style={cellInputStyle}
                              onChange={(event) =>
                                updateArray(index, "orientation", Number(event.target.value))
                              }
                            />
                          </td>

                          <td style={{ padding: "10px", borderBottom: "1px solid #eef2f7" }}>
                            <input
                              type="number"
                              value={array.pitch ?? ""}
                              min={0}
                              max={90}
                              style={cellInputStyle}
                              onChange={(event) =>
                                updateArray(index, "pitch", Number(event.target.value))
                              }
                            />
                          </td>

                          <td style={{ padding: "10px", borderBottom: "1px solid #eef2f7" }}>
                            <input
                              type="number"
                              value={array.irradiance ?? ""}
                              min={0}
                              step={0.01}
                              style={cellInputStyle}
                              onChange={(event) =>
                                updateArray(index, "irradiance", Number(event.target.value))
                              }
                            />
                          </td>

                          <td style={{ padding: "10px", borderBottom: "1px solid #eef2f7" }}>
                            <input
                              type="number"
                              value={array.shading ?? ""}
                              min={0}
                              max={1}
                              step={0.01}
                              style={cellInputStyle}
                              onChange={(event) =>
                                updateArray(index, "shading", Number(event.target.value))
                              }
                            />
                          </td>

                          <td style={{ padding: "10px", borderBottom: "1px solid #eef2f7" }}>
                            <input
                              type="text"
                              value={
                                calculated
                                  ? Number(calculated.systemSize || 0).toFixed(2)
                                  : "0.00"
                              }
                              disabled
                              style={{
                                ...cellInputStyle,
                                background: "#f8fafc",
                                color: "#475569",
                              }}
                            />
                          </td>

                          <td style={{ padding: "10px", borderBottom: "1px solid #eef2f7" }}>
                            <input
                              type="text"
                              value={
                                calculated
                                  ? Number(calculated.generation || 0).toFixed(2)
                                  : "0.00"
                              }
                              disabled
                              style={{
                                ...cellInputStyle,
                                background: "#f8fafc",
                                color: "#475569",
                              }}
                            />
                          </td>
                        </tr>
                      )
                    })}
                </tbody>
              </table>
            </div>

'''

          path.write_text(text[:start] + replacement + text[end:])

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/update-epvs-array-table.yml .github/epvs-array-table-trigger.txt
          git add src/EPVSCalculator.jsx .github/workflows/update-epvs-array-table.yml .github/epvs-array-table-trigger.txt
          git commit -m 'Display EPVS solar arrays as a table'
          git push
