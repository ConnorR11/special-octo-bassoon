name: One-time T&C title spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  amend:
    if: github.event.head_commit.message != 'Amend T&C title spacing'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Amend T&C title spacing
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/contracts/GenerateSolarContract.js")
          text = path.read_text()

          old_title = '  const titleY = ctx.y + 4\n'
          new_title = '  const titleY = terms ? ctx.y - 2 : ctx.y + 4\n'

          old_line = '    pdf.rect(ctx.padding, ctx.y + 11, ctx.width - (ctx.padding * 2), 1.2, "F")\n'
          new_line = '    pdf.rect(ctx.padding, ctx.y + 5, ctx.width - (ctx.padding * 2), 1.2, "F")\n'

          if old_title not in text:
              raise SystemExit("Expected title positioning code was not found; no change made.")
          if old_line not in text:
              raise SystemExit("Expected T&C rule positioning code was not found; no change made.")

          text = text.replace(old_title, new_title, 1)
          text = text.replace(old_line, new_line, 1)
          path.write_text(text)

      - name: Commit amendment and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-tc-title-spacing.yml
          git add src/contracts/GenerateSolarContract.js
          git commit -m "Amend T&C title spacing"
          git push origin main
