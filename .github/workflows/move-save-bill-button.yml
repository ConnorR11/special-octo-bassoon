name: Move Save Current Bill button

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current EPVS source
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/EPVSCalculator.jsx")
          text = path.read_text()

          if "Save Current Bill Info" in text:
              print("Save Current Bill Info already applied; nothing to change.")
              raise SystemExit(0)

          old_card = '''function Card({
  title,
  subtitle,
  children,
}) {'''
          new_card = '''function Card({
  title,
  subtitle,
  action,
  children,
}) {'''
          assert old_card in text, "Could not locate Card signature"
          text = text.replace(old_card, new_card, 1)

          old_head = '''      <div
        className="card-head"
      >
        <div>
          <h2>{title}</h2>

          <p>
            {subtitle}
          </p>
        </div>
      </div>'''
          new_head = '''      <div
        className="card-head"
        style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16 }}
      >
        <div>
          <h2>{title}</h2>

          <p>
            {subtitle}
          </p>
        </div>
        {action && <div style={{ marginLeft: "auto", flexShrink: 0 }}>{action}</div>}
      </div>'''
          assert old_head in text, "Could not locate Card header"
          text = text.replace(old_head, new_head, 1)

          old_energy = '''          <Card
            title="Energy"
            subtitle="Electricity usage and existing solar PV."
          >'''
          new_energy = '''          <Card
            title="Energy"
            subtitle="Electricity usage and existing solar PV."
            action={
              <button
                type="button"
                onClick={saveCalculation}
                disabled={savingCalculation || !hasRequiredEnergyInputs}
                style={{
                  ...styles.primary,
                  opacity: savingCalculation || !hasRequiredEnergyInputs ? 0.65 : 1,
                  cursor: savingCalculation || !hasRequiredEnergyInputs ? "default" : "pointer",
                  whiteSpace: "nowrap",
                }}
              >
                {savingCalculation ? "Saving..." : "Save Current Bill Info"}
              </button>
            }
          >'''
          assert old_energy in text, "Could not locate current Energy card"
          text = text.replace(old_energy, new_energy, 1)

          old_bar = '''          <div
            style={{
              display: "flex",
              alignItems: "center",
              justifyContent: "flex-end",
              gap: 12,
              marginTop: -4,
              marginBottom: 20,
              padding: "12px 0",
            }}
          >
            <div
              style={{
                marginRight: "auto",
                fontSize: 11,
                color: saveError ? "#b42318" : "#299d48",
                fontWeight: 600,
              }}
            >
              {saveError || saveMessage}
            </div>

            <button
              type="button"
              onClick={saveCalculation}
              disabled={savingCalculation || !hasRequiredEnergyInputs}
              style={{
                ...styles.primary,
                opacity: savingCalculation || !hasRequiredEnergyInputs ? 0.65 : 1,
                cursor: savingCalculation || !hasRequiredEnergyInputs ? "default" : "pointer",
              }}
            >
              {savingCalculation ? "Saving..." : "Save calculation"}
            </button>
          </div>
'''
          assert old_bar in text, "Could not locate old save button bar"
          new_bar = '''          {(saveError || saveMessage) && (
            <div
              style={{
                marginTop: 8,
                marginBottom: 20,
                fontSize: 11,
                color: saveError ? "#b42318" : "#299d48",
                fontWeight: 600,
              }}
            >
              {saveError || saveMessage}
            </div>
          )}
'''
          text = text.replace(old_bar, new_bar, 1)

          path.write_text(text)

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/EPVSCalculator.jsx
          git commit -m 'Move Save Current Bill Info into Energy header'
          git push
