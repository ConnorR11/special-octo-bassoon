name: Patch contract EPVS array table

on:
  push:
    branches: [main]
    paths:
      - '.github/contract-epvs-array-table-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: add contract EPVS array table [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add array table to contract renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/contracts/GenerateSolarContract.js')
          s = p.read_text()

          if 'CONTRACT_EPVS_SOLAR_ARRAY_TABLE' in s:
              print('Already patched')
              raise SystemExit(0)

          helper = r'''

          /* CONTRACT_EPVS_SOLAR_ARRAY_TABLE */
          function drawEpvsSolarArrayTable(pdf, ctx, data, results, startY) {
            const arrays = (Array.isArray(data?.arrays) ? data.arrays : [])
              .slice(0, Number(data?.numberOfArrays || data.arrays?.length || 0))
              .map((input, index) => ({
                input: input || {},
                calculated: Array.isArray(results?.arrays) ? (results.arrays[index] || {}) : {},
                index,
              }))
              .filter(({ input, calculated }) => Number(input.panelCount || calculated.panelCount || 0) > 0)

            if (!arrays.length) return startY

            const width = ctx.width - (ctx.padding * 2)
            const rowH = 7
            const titleH = 7
            const headerH = 7
            const bottom = ctx.height - 17
            let y = Number(startY || (ctx.y + 70))

            if (y + titleH + headerH + arrays.length * rowH + 8 > bottom) {
              pdf.addPage()
              const pageWidth = pdf.internal.pageSize.getWidth()
              const pageHeight = pdf.internal.pageSize.getHeight()
              pdf.setFillColor(255, 255, 255)
              pdf.rect(0, 0, pageWidth, pageHeight, 'F')
              pdf.setFillColor(...ctx.accent)
              pdf.rect(0, 0, pageWidth, 14, 'F')
              pdf.setTextColor(255, 255, 255)
              pdf.setFont('helvetica', 'bold')
              pdf.setFontSize(8)
              pdf.text('HOMESHIELD SCOTLAND LTD', ctx.padding, 9)
              pdf.setFont('helvetica', 'normal')
              pdf.setFontSize(7)
              pdf.text(CONTRACT_NAME, pageWidth - ctx.padding, 9, { align: 'right' })
              y = 28
            }

            pdf.setTextColor(...ctx.text)
            pdf.setFont('helvetica', 'bold')
            pdf.setFontSize(10)
            pdf.text('Solar PV array', ctx.padding, y)
            y += titleH

            const columns = [
              ['Array', 16],
              ['Panels', 14],
              ['Wp', 12],
              ['Orientation', 19],
              ['Pitch', 12],
              ['Irradiance', 20],
              ['SF', 12],
              ['System size', 25],
              ['Generation', 30],
            ]
            const total = columns.reduce((sum, [, weight]) => sum + weight, 0)
            const widths = columns.map(([, weight]) => width * weight / total)
            let x = ctx.padding

            pdf.setFillColor(...ctx.accent)
            pdf.roundedRect(ctx.padding, y, width, headerH, 1.2, 1.2, 'F')
            pdf.setTextColor(255, 255, 255)
            pdf.setFont('helvetica', 'bold')
            pdf.setFontSize(5.5)
            columns.forEach(([label], i) => {
              pdf.text(label, x + 1.4, y + 4.8)
              x += widths[i]
            })
            y += headerH

            arrays.forEach(({ input, calculated, index }, rowIndex) => {
              x = ctx.padding
              if (rowIndex % 2 === 0) {
                pdf.setFillColor(246, 248, 250)
                pdf.rect(ctx.padding, y, width, rowH, 'F')
              }

              const values = [
                `Array ${index + 1}`,
                num(input.panelCount || calculated.panelCount || 0),
                num(input.panelWattage || calculated.panelWattage || 0),
                input.orientation === undefined || input.orientation === '' ? '—' : `${num(input.orientation)}°`,
                input.pitch === undefined || input.pitch === '' ? '—' : `${num(input.pitch)}°`,
                input.irradiance === undefined || input.irradiance === '' ? '—' : num(input.irradiance, 2),
                input.shading === undefined || input.shading === '' ? '—' : num(input.shading, 2),
                calculated.systemSize === undefined ? '—' : `${num(calculated.systemSize, 2)} kWp`,
                calculated.generation === undefined ? '—' : `${num(calculated.generation)} kWh`,
              ]

              pdf.setTextColor(...ctx.text)
              pdf.setFont('helvetica', 'normal')
              pdf.setFontSize(5.7)
              values.forEach((value, i) => {
                pdf.text(String(value), x + 1.4, y + 4.8)
                x += widths[i]
              })
              y += rowH
            })

            return y + 7
          }
          '''

          marker = 'async function renderPage(pdf,page,index,pageCount,appointment,epvs){'
          if marker not in s:
              raise SystemExit('renderPage marker not found')
          s = s.replace(marker, helper + '\n' + marker, 1)

          match = re.search(r'if\(kind\s*===\s*["\']epvs["\']\)\s*\{', s)
          if not match:
              raise SystemExit('EPVS render branch not found')

          start = match.end()
          next_branch = re.search(r'\}\s*else\s+if\(kind\s*===|\}\s*else\s*\{', s[start:])
          if not next_branch:
              raise SystemExit('End of EPVS render branch not found')
          branch_end = start + next_branch.start()

          call = '''\n    /* CONTRACT_EPVS_SOLAR_ARRAY_TABLE_CALL */\n    drawEpvsSolarArrayTable(pdf, ctx, data, results, typeof y === "number" ? y + 8 : ctx.y + 70)\n'''
          s = s[:branch_end] + call + s[branch_end:]
          p.write_text(s)
          PY

          rm .github/workflows/patch-contract-epvs-array-table.yml .github/contract-epvs-array-table-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contracts/GenerateSolarContract.js .github/workflows/patch-contract-epvs-array-table.yml .github/contract-epvs-array-table-trigger.txt
          git commit -m 'chore: add contract EPVS array table [skip ci]'
          git push
