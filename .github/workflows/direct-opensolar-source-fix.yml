name: Direct OpenSolar source fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use OpenSolar irradiance directly
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/EPVSCalculator.jsx")
          text = path.read_text()

          text = text.replace('import { getIrradiance } from "./epvsIrradianceData"\n', '')

          start = text.find('  const arrayGeometryKey = data.arrays\n')
          if start != -1:
              end = text.find('  const updateArray = (\n', start)
              assert end != -1
              text = text[:start] + text[end:]

          path.write_text(text)

          irradiance_path = Path("src/epvsIrradianceData.js")
          if irradiance_path.exists():
              irradiance_path.unlink()

          Path("scripts/update-opensolar-design.mjs").write_text('import fs from "node:fs"\nconsole.log("Using checked-in EPVS source; no build-time UI rewriting.")\n')
          Path(".github/workflows/direct-opensolar-source-fix.yml").unlink()

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/EPVSCalculator.jsx src/epvsIrradianceData.js scripts/update-opensolar-design.mjs .github/workflows/direct-opensolar-source-fix.yml
          git commit -m 'Use OpenSolar irradiance directly'
          git push
