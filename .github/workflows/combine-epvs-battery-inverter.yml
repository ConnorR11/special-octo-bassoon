name: Combine EPVS battery and inverter cards

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Battery and Inverter cards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          start_marker = '                  <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>'
          end_marker = '            <Card\n              title="EPVS battery & inverter assumptions"'

          start = text.find(start_marker)
          if start == -1:
              raise SystemExit('Battery/Inverter wrapper was not found; no changes made.')

          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('EPVS assumptions card was not found; no changes made.')

          new_block = '''                  <Card
            title="Battery & Inverter"
            subtitle="Configure the proposed battery and inverter."
          >
            <div style={styles.grid}>
              <label style={styles.field}>
                <span>Battery configuration</span>

                <select
                  value={data.batteryCapacity}
                  onChange={(event) =>
                    update(
                      "batteryCapacity",
                      event.target.value === ""
                        ? ""
                        : Number(event.target.value)
                    )
                  }
                >
                  <option value="">Select battery</option>
                  <option value={0}>No battery</option>
                  <option value={5.12}>1 × 5.12 kWh</option>
                  <option value={10.24}>2 × 5.12 kWh</option>
                  <option value={15.36}>3 × 5.12 kWh</option>
                  <option value={9.4}>1 × 9.4 kWh</option>
                  <option value={18.8}>2 × 9.4 kWh</option>
                  <option value={28.2}>3 × 9.4 kWh</option>
                </select>
              </label>

              <label style={styles.field}>
                <span>Inverter capacity (kW)</span>

                <select
                  value={data.inverterCapacity}
                  onChange={(event) =>
                    update(
                      "inverterCapacity",
                      event.target.value === ""
                        ? ""
                        : Number(event.target.value)
                    )
                  }
                >
                  <option value="">Select inverter</option>
                  <option value={3.7}>3.7 kW</option>
                  <option value={6}>6 kW</option>
                  <option value={7}>7 kW</option>
                  <option value={10}>10 kW</option>
                </select>
              </label>
            </div>
          </Card>

'''

          text = text[:start] + new_block + text[end:]
          path.write_text(text)
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Combine EPVS battery and inverter cards"
          git push