name: Fix commission stage filtering

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update commission deal handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/App.jsx")
          text = path.read_text()

          old = '  function handleDealUpdated(updatedDeal) { setContracts(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract)); setAllDeals(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract)); setCommissionDeals(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract)); setSelected(updatedDeal) }'

          new = '''  function handleDealUpdated(updatedDeal) {
    const excludedCommissionStages = new Set(["decline", "customer cancelled", "returned to sales", "awaiting funds", "on hold", "pending cancellation"])
    const stage = String(updatedDeal?.pipedrive_stage ?? "").trim().replace(/\\s+/g, " ").toLowerCase()
    const shouldRemoveFromCommissions = excludedCommissionStages.has(stage)

    setContracts(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract))
    setAllDeals(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract))
    setCommissionDeals(current => shouldRemoveFromCommissions
      ? current.filter(contract => contract.id !== updatedDeal.id)
      : current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract)
    )
    setSelected(updatedDeal)
  }'''

          if old not in text:
              raise SystemExit("Expected handleDealUpdated code was not found; no changes made.")

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git rm .github/workflows/fix-commission-stage.yml
          git commit -m "Remove excluded stages from commission state"
          git push
