name: Fix API page length error

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Harden IntegrationLogs array handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/pages/IntegrationLogs.jsx")
          text = path.read_text()
          replacements = [
              ("const providers = providerOptions", "const providers = Array.isArray(providerOptions) ? providerOptions : []"),
              ("if (!dailyData.length) return null", "if (!Array.isArray(dailyData) || !dailyData.length) return null"),
              ("const chartLogs = React.useState([])", "const chartLogs = React.useState([])"),
              ("!logs.length ? <div className=\"integration-logs-empty\">No integration events found.</div>", "!(Array.isArray(logs) && logs.length) ? <div className=\"integration-logs-empty\">No integration events found.</div>"),
              ("<tbody>{logs.map(log => {", "<tbody>{(Array.isArray(logs) ? logs : []).map(log => {"),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/IntegrationLogs.jsx
          git rm .github/workflows/fix-api-length.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix API page array handling"
          git push
