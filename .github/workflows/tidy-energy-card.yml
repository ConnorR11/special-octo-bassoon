name: Tidy EPVS Energy card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tidy:
    if: github.event.head_commit.message != 'Tidy EPVS Energy card [automated]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restyle Energy card
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          start_marker = '''          <Card\n            title="Energy"\n            subtitle="Electricity usage and existing solar PV."\n          >'''
          end_marker = '''       {/* =================================================\n    SOLAR PV\n    ================================================= */}'''

          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate Energy card boundaries')

          replacement = '''          <Card\n            title="Energy"\n            subtitle="Electricity usage and existing solar PV."\n          >\n            <div\n              style={{\n                border: "1px solid #dbe3ec",\n                borderRadius: 10,\n                overflow: "hidden",\n                background: "#ffffff",\n              }}\n            >\n              {/* ELECTRICITY */}\n              <div\n                style={{\n                  padding: "12px 14px",\n                  background: "#f8fafc",\n                  borderBottom: "1px solid #dbe3ec",\n                  color: "#172554",\n                  fontSize: 13,\n                  fontWeight: 700,\n                }}\n              >\n                Electricity\n              </div>\n\n              <div style={{ padding: 14 }}>\n                <div style={styles.grid}>\n                  <Input\n                    label="Annual electricity consumption (kWh)"\n                    type="number"\n                    value={data.annualConsumption}\n                    onChange={(value) => update("annualConsumption", value)}\n                    min={0}\n                  />\n                  <Input\n                    label="Current import rate (p/kWh)"\n                    type="number"\n                    value={data.importRate}\n                    onChange={(value) => update("importRate", value)}\n                    min={0}\n                    step={0.01}\n                  />\n                  <Input\n                    label="Current export rate (p/kWh)"\n                    type="number"\n                    value={data.exportRate}\n                    onChange={(value) => update("exportRate", value)}\n                    min={0}\n                    step={0.01}\n                  />\n                  <Input\n                    label="Current standing charge (p/day)"\n                    type="number"\n                    value={data.standingCharge}\n                    onChange={(value) => update("standingCharge", value)}\n                    min={0}\n                    step={0.01}\n                  />\n                </div>\n\n                {!hasRequiredEnergyInputs && (\n                  <div\n                    style={{\n                      marginTop: 10,\n                      padding: "8px 10px",\n                      borderRadius: 7,\n                      background: "#fffbeb",\n                      border: "1px solid #fde68a",\n                      fontSize: 11,\n                      color: "#92400e",\n                    }}\n                  >\n                    Enter all four electricity values before continuing to the calculation.\n                  </div>\n                )}\n              </div>\n\n              {/* EXISTING SOLAR */}\n              <div\n                style={{\n                  padding: "12px 14px",\n                  background: "#f8fafc",\n                  borderTop: "1px solid #dbe3ec",\n                  borderBottom: "1px solid #dbe3ec",\n                  color: "#172554",\n                  fontSize: 13,\n                  fontWeight: 700,\n                }}\n              >\n                Existing solar PV\n              </div>\n\n              <div style={{ padding: 14 }}>\n                <div style={styles.grid}>\n                  <Toggle\n                    label="Existing solar PV"\n                    value={data.existingSolar}\n                    onChange={(value) => update("existingSolar", value)}\n                  />\n                  {data.existingSolar && (\n                    <Input\n                      label="Existing annual generation (kWh)"\n                      type="number"\n                      value={data.existingGeneration}\n                      onChange={(value) => update("existingGeneration", value)}\n                      min={0}\n                    />\n                  )}\n                  {data.existingSolar && (\n                    <Input\n                      label="Existing solar self-consumption (%)"\n                      type="number"\n                      value={data.existingSolarSelfConsumption}\n                      onChange={(value) => update("existingSolarSelfConsumption", value)}\n                      min={0}\n                      max={100}\n                      step={1}\n                    />\n                  )}\n                </div>\n              </div>\n            </div>\n          </Card>\n\n'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx
          git commit -m "Tidy EPVS Energy card [automated]"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/tidy-energy-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tidy-energy-card.yml
          git commit -m "Remove temporary energy card workflow [automated]"
          git push
