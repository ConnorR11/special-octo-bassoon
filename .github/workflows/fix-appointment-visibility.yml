name: Fix appointment visibility
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
      - name: Fix manager visibility and MarketingTV profile visibility
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/App.jsx': [
                  ('sales_manager.eq.${viewerId},branch_manager.eq.${viewerId}', 'sales_manager.eq.${viewerId},manager_id.eq.${viewerId}'),
                  (') : page === "fit-sheet" ? (', ') : (page === "fit-sheet" || page === "fitsheet") ? ('),
                  (') : page === "dashboard" ? (\n          homeContent', ') : page === "sales-performance" ? (\n          <Dashboard\n            contracts={allDeals}\n            total={totalValue}\n            avg={averageValue}\n            upcoming={upcomingInstallations}\n            setSelected={setSelected}\n          />\n        ) : page === "dashboard" ? (\n          homeContent'),
              ],
              'src/pages/SalesCommission.jsx': [
                  ('sales_manager.eq.${viewerProfileId},branch_manager.eq.${viewerProfileId}', 'sales_manager.eq.${viewerProfileId},manager_id.eq.${viewerProfileId}'),
              ],
              'src/pages/Appointments.jsx': [
                  ('sales_manager.eq.${viewerId},branch_manager.eq.${viewerId}', 'sales_manager.eq.${viewerId},manager_id.eq.${viewerId}'),
              ],
              'src/pages/MarketingTV.jsx': [
                  ('  const numericPermissionLevel = Number(permissionLevel) || 0\n  const canViewAllAppointments = numericPermissionLevel >= 3 || isCentralConfirmationManager(role)\n  const canViewBranchAppointments = numericPermissionLevel >= 2\n', ''),
                  ('      const endDate = new Date(`${date}T00:00:00Z`); endDate.setUTCDate(endDate.getUTCDate() + 1)\n', '      const effectivePermissionLevel = Number(viewerProfile?.permission_level ?? permissionLevel) || 0\n      const effectiveRole = viewerProfile?.role || role\n      const canViewAllAppointments = effectivePermissionLevel >= 3 || isCentralConfirmationManager(effectiveRole)\n      const canViewBranchAppointments = effectivePermissionLevel >= 2\n\n      const endDate = new Date(`${date}T00:00:00Z`); endDate.setUTCDate(endDate.getUTCDate() + 1)\n'),
              ],
          }

          for filename, pairs in replacements.items():
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text()
              original = s
              for old, new in pairs:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s)
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/MarketingTV.jsx')
          s = p.read_text()
          old = '  const numericPermissionLevel = Number(permissionLevel) || 0\n  const canViewAllAppointments = numericPermissionLevel >= 3 || isCentralConfirmationManager(role)\n  const canViewBranchAppointments = numericPermissionLevel >= 2\n'
          if old in s:
              s = s.replace(old, '', 1)
          old = '      const endDate = new Date(`${date}T00:00:00Z`); endDate.setUTCDate(endDate.getUTCDate() + 1)\n'
          new = '      const effectivePermissionLevel = Number(viewerProfile?.permission_level ?? permissionLevel) || 0\n      const effectiveRole = viewerProfile?.role || role\n      const canViewAllAppointments = effectivePermissionLevel >= 3 || isCentralConfirmationManager(effectiveRole)\n      const canViewBranchAppointments = effectivePermissionLevel >= 2\n\n      const endDate = new Date(`${date}T00:00:00Z`); endDate.setUTCDate(endDate.getUTCDate() + 1)\n'
          if 'const effectivePermissionLevel' not in s and old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
            git add src/ .github/workflows/fix-appointment-visibility.yml
            git rm .github/workflows/fix-appointment-visibility.yml || true
            git commit -m "Fix MarketingTV profile-based visibility" || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1