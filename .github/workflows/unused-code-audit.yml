name: Unused Code Audit

on:
  push:
    branches:
      - refactor/remove-unused-code
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit unused variables and parameters
        run: |
          npx --yes eslint@9 src \
            --no-config \
            --no-ignore \
            --ext .js,.jsx \
            --rule 'no-unused-vars:error' \
            --rule 'no-undef:error' \
            --format stylish
