name: Fix EPVS select styling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add EPVS select styling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/index.css')
          text = path.read_text()
          marker = '/* EPVS BATTERY AND INVERTER SELECTS */'
          if marker not in text:
              text += '''\n\n/* EPVS BATTERY AND INVERTER SELECTS */\n.card select:has(option[value="5.12"]),\n.card select:has(option[value="3.7"]) {\n  width: 100%;\n  min-height: 38px;\n  box-sizing: border-box;\n  padding: 9px 32px 9px 10px;\n  border: 1px solid #cbd5e1;\n  border-radius: 7px;\n  background: #ffffff;\n  color: #172554;\n  font-size: 12px;\n  outline: none;\n  cursor: pointer;\n}\n\n.card select:has(option[value="5.12"]):focus,\n.card select:has(option[value="3.7"]):focus {\n  border-color: #94a3b8;\n  box-shadow: 0 0 0 2px rgba(23, 37, 84, 0.08);\n}\n'''\n              path.write_text(text)\n          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Apply rounded EPVS battery and inverter selects"
            git push
          fi
