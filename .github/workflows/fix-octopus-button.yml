name: Fix Octopus rates button

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-button:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace the actual Get current rates button icon
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          old_target = '<img src="/octopus-logo.svg" alt="" aria-hidden="true" style={{ width: 20, height: 20, objectFit: "contain", display: "block" }} />'
          new_target = '<OctopusLogo />'

          if old_target in text:
              text = text.replace(old_target, new_target, 1)

          text = text.replace('\n\\\nfunction OctopusLogo()', '\nfunction OctopusLogo()')

          if '<OctopusLogo />' in text and 'function OctopusLogo()' not in text:
              component = '''function OctopusLogo() {
            return (
              <svg
                width="18"
                height="18"
                viewBox="0 0 48 48"
                aria-hidden="true"
                focusable="false"
                style={{ display: "block", flexShrink: 0 }}
              >
                <path
                  d="M24 5c-8.3 0-15 6.7-15 15v6.5c0 2.4-1.5 4.2-3.5 5.5C3.8 33.2 4.2 37 7 38.5c2.1 1.1 4.3.3 5.4-1.3.1 3.3 2.1 5.8 5 5.8 2.1 0 3.8-1.1 4.8-2.9 0.5 2.3 1.9 3.9 3.8 3.9s3.3-1.6 3.8-3.9c1 1.8 2.7 2.9 4.8 2.9 2.9 0 4.9-2.5 5-5.8 1.1 1.6 3.3 2.4 5.4 1.3 2.8-1.5 3.2-5.3 1.5-6.5-2-1.3-3.5-3.1-3.5-5.5V20C39 11.7 32.3 5 24 5Z"
                  fill="#ff48d8"
                />
                <circle cx="18" cy="21" r="4.2" fill="#fff" />
                <circle cx="30" cy="21" r="4.2" fill="#fff" />
                <circle cx="18.8" cy="21" r="2.3" fill="#18005c" />
                <circle cx="30.8" cy="21" r="2.3" fill="#18005c" />
                <path
                  d="M19 29c2.8 2.8 7.2 2.8 10 0"
                  fill="none"
                  stroke="#18005c"
                  strokeWidth="2.8"
                  strokeLinecap="round"
                />
              </svg>
            )
          }

          '''
              marker = 'function Input({'
              text = text.replace(marker, component + marker, 1)

          path.write_text(text)
          PY

      - name: Migrate sales presenter code to template tables
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/components/AppointmentActions.jsx
            src/components/DatabaseSalesPresenter.jsx
            src/components/DatabaseSalesPresenterV2.jsx
            src/pages/SalesPresentations.jsx
          )
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              sed -i 's/sales_presentation_slides/template_pages/g; s/sales_presentations/templates/g' "$file"
            fi
          done
          rm -f .github/workflows/migrate-presenter-tables.yml MIGRATE_TRIGGER.md

      - name: Apply solar contract cover redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/contracts/GenerateSolarContract.js')
          text = path.read_text()

          text, removed = re.subn(r'\nfunction drawBlueprintHouse\(pdf, x, y, width, height, accent\) \{.*?\n\}\n\nfunction header\(', '\nfunction header(', text, count=1, flags=re.S)
          if removed not in (0, 1):
              raise SystemExit(f'Unexpected number of house helpers removed: {removed}')

          start = text.find('  if(kind==="cover"){')
          if start == -1:
              raise SystemExit('Solar cover block was not found.')
          end = text.find('\n  }\n  title(pdf,page,ctx);', start)
          if end == -1:
              raise SystemExit('Solar cover block end was not found.')
          end += len('\n  }')

          new = '''  if(kind==="cover"){
    const navy=rgb(settings.background,[5,47,79]);
    const cyan=[52,190,245];
    const pale=[205,221,232];
    pdf.setFillColor(...navy);pdf.rect(0,0,ctx.width,ctx.height,"F");

    let logo=null;
    try{logo=await imageData("/homeshield-logo.png")}catch(error){console.warn("Homeshield logo could not be loaded:",error)}
    if(logo){
      const logoWidth=38;
      const logoHeight=logoWidth*(logo.height/logo.width);
      pdf.addImage(logo.dataUrl,"PNG",ctx.padding,14,logoWidth,logoHeight,undefined,"FAST");
    }else{
      pdf.setTextColor(255,255,255);pdf.setFont("helvetica","bold");pdf.setFontSize(10);pdf.text("HOMESHIELD SCOTLAND LTD",ctx.padding,24);
    }
    pdf.setTextColor(...pale);pdf.setFont("helvetica","normal");pdf.setFontSize(6.5);pdf.text("WINDOWS   |   DOORS   |   SOLAR   |   RENEWABLES",ctx.width-ctx.padding,23,{align:"right"});

    pdf.setTextColor(255,255,255);pdf.setFont("helvetica","bold");pdf.setFontSize(27);pdf.text("Solar Contract",ctx.padding,76);
    pdf.setFont("helvetica","normal");pdf.setFontSize(11);pdf.text("Prepared for",ctx.padding,89);
    pdf.setFont("helvetica","bold");pdf.setFontSize(17);pdf.text(textValue(appointment?.name||data.customerName,"Customer"),ctx.padding,102);
    pdf.setFont("helvetica","normal");pdf.setFontSize(8);pdf.setTextColor(...pale);const address=[appointment?.address,appointment?.postcode].filter(Boolean).join(", ");if(address)pdf.text(address,ctx.padding,112);
    pdf.setFillColor(...cyan);pdf.rect(ctx.padding,122,26,1.2,"F");

    pdf.setTextColor(...pale);pdf.setFontSize(7);pdf.text("CLEANER HOMES",ctx.width-ctx.padding,54,{align:"right"});pdf.text("BRIGHTER FUTURES",ctx.width-ctx.padding,61,{align:"right"});pdf.text("A GREENER SCOTLAND",ctx.width-ctx.padding,68,{align:"right"});
    pdf.setDrawColor(...cyan);pdf.setLineWidth(0.3);pdf.line(ctx.width-ctx.padding-16,72,ctx.width-ctx.padding,72);

    const bottomTop=ctx.height-57;
    pdf.setFillColor(...navy);pdf.rect(0,bottomTop,ctx.width,57,"F");
    pdf.setFillColor(...cyan);pdf.rect(ctx.padding,bottomTop+6,1.3,32,"F");
    pdf.setTextColor(215,229,238);pdf.setFont("helvetica","normal");pdf.setFontSize(7);pdf.text("INVESTING IN",ctx.padding+8,bottomTop+14);pdf.text("A CLEANER, GREENER",ctx.padding+8,bottomTop+23);pdf.text("SCOTLAND",ctx.padding+8,bottomTop+32);

    const benefits=[["CLEANER","ENERGY"],["LOWER","BILLS"],["WARMER","HOMES"],["BRIGHTER","FUTURES"]];
    const startX=ctx.width-ctx.padding-64;
    benefits.forEach((item,i)=>{
      const bx=startX+i*17;
      pdf.setDrawColor(...cyan);pdf.setLineWidth(0.45);pdf.circle(bx,bottomTop+15,3.5,"S");
      if(i===0){pdf.line(bx-1.5,bottomTop+17,bx+1.5,bottomTop+13);pdf.line(bx-1,bottomTop+17,bx+1,bottomTop+17)}
      if(i===1){pdf.setFont("helvetica","bold");pdf.setFontSize(5);pdf.setTextColor(...cyan);pdf.text("£",bx,bottomTop+17,{align:"center"})}
      if(i===2){pdf.line(bx,bottomTop+17,bx,bottomTop+13);pdf.line(bx-2,bottomTop+15,bx,bottomTop+13);pdf.line(bx+2,bottomTop+15,bx,bottomTop+13)}
      if(i===3){pdf.line(bx,bottomTop+17,bx,bottomTop+13);pdf.line(bx,bottomTop+14,bx-2,bottomTop+12);pdf.line(bx,bottomTop+14,bx+2,bottomTop+11)}
      pdf.setTextColor(220,233,241);pdf.setFont("helvetica","normal");pdf.setFontSize(5.2);pdf.text(item[0],bx,bottomTop+27,{align:"center"});pdf.text(item[1],bx,bottomTop+34,{align:"center"});
    });
    return
  }'''

          text = text[:start] + new + text[end:]
          path.write_text(text)
          PY
          rm -f .github/workflows/update-solar-cover.yml

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Refine solar contract cover layout"
          git push
