name: Fix Octopus rates button

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-button:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace button icon
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          old_icon = '<RotateCcw size={15} />'
          new_icon = '<OctopusLogo />'

          component = r'''\
          function OctopusLogo() {
            return (
              <svg
                width="18"
                height="18"
                viewBox="0 0 48 48"
                aria-hidden="true"
                focusable="false"
                style={{ display: "block", flexShrink: 0 }}
              >
                <path
                  d="M24 5c-8.3 0-15 6.7-15 15v6.5c0 2.4-1.5 4.2-3.5 5.5C3.8 33.2 4.2 37 7 38.5c2.1 1.1 4.3.3 5.4-1.3.1 3.3 2.1 5.8 5 5.8 2.1 0 3.8-1.1 4.8-2.9 0.5 2.3 1.9 3.9 3.8 3.9s3.3-1.6 3.8-3.9c1 1.8 2.7 2.9 4.8 2.9 2.9 0 4.9-2.5 5-5.8 1.1 1.6 3.3 2.4 5.4 1.3 2.8-1.5 3.2-5.3 1.5-6.5-2-1.3-3.5-3.1-3.5-5.5V20C39 11.7 32.3 5 24 5Z"
                  fill="#ff48d8"
                />
                <circle cx="18" cy="21" r="4.2" fill="#fff" />
                <circle cx="30" cy="21" r="4.2" fill="#fff" />
                <circle cx="18.8" cy="21" r="2.3" fill="#18005c" />
                <circle cx="30.8" cy="21" r="2.3" fill="#18005c" />
                <path
                  d="M19 29c2.8 2.8 7.2 2.8 10 0"
                  fill="none"
                  stroke="#18005c"
                  strokeWidth="2.8"
                  strokeLinecap="round"
                />
              </svg>
            )
          }

          '''

          if new_icon not in text and old_icon in text:
              text = text.replace(old_icon, new_icon, 1)

          if 'function OctopusLogo()' not in text:
              marker = 'function Input({'
              if marker not in text:
                  raise SystemExit('Could not find Input component insertion point')
              text = text.replace(marker, component + marker, 1)

          path.write_text(text)
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx
          git diff --cached --quiet || git commit -m "Use Octopus logo on Flux rates button"
          git push
