name: Lock solar array table

on:
  push:
    paths:
      - '.github/lock-solar-array-table-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make solar array table read-only
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          old = '              background: "#ffffff",\n              color: "#172554",\n              fontSize: 12,\n              outline: "none",'
          new = '              background: "#f1f5f9",\n              color: "#475569",\n              fontSize: 12,\n              outline: "none",\n              cursor: "not-allowed",'
          if old in text:
              text = text.replace(old, new, 1)

          replacements = [
            (
              '''                    style={inputStyle}\n                    onChange={(event) =>\n                      updateArray(\n                        index,\n                        "panelCount",\n                        event.target.value\n                      )\n                    }''',
              '''                    style={inputStyle}\n                    readOnly\n                    aria-label="Panels"'''
            ),
            (
              '''                    style={inputStyle}\n                    onChange={(event) =>\n                      updateArray(\n                        index,\n                        "orientation",\n                        event.target.value\n                      )\n                    }''',
              '''                    style={inputStyle}\n                    readOnly\n                    aria-label="Orientation"'''
            ),
            (
              '''                    style={inputStyle}\n                    onChange={(event) =>\n                      updateArray(\n                        index,\n                        "pitch",\n                        event.target.value\n                      )\n                    }''',
              '''                    style={inputStyle}\n                    readOnly\n                    aria-label="Pitch"'''
            ),
            (
              '''                    style={inputStyle}\n                    onChange={(event) =>\n                      updateArray(\n                        index,\n                        "shading",\n                        event.target.value\n                      )\n                    }''',
              '''                    style={inputStyle}\n                    readOnly\n                    aria-label="Shade factor"'''
            ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Could not locate expected solar array input block: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/lock-solar-array-table.yml .github/lock-solar-array-table-trigger.txt
          git add src/EPVSCalculator.jsx .github/workflows/lock-solar-array-table.yml .github/lock-solar-array-table-trigger.txt
          git commit -m 'Make solar array table read-only'
          git push
