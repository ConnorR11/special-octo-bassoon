name: Update WindowCosting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WindowCosting
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path("src/WindowCosting.jsx")
          text = path.read_text(encoding="utf-8")
          original = text

          marker = '''    discountable:\n      row.discountable !== null &&\n      row.discountable !== undefined\n        ? Number(row.discountable)\n        : null,\n'''

          replacement = marker + '''\n    nonDiscountable:\n      row.non_discountable !== null &&\n      row.non_discountable !== undefined\n        ? Number(row.non_discountable)\n        : null,\n'''

          if "nonDiscountable:" not in text:
              if marker not in text:
                  raise SystemExit("Could not find discountable mapper section")
              text = text.replace(marker, replacement, 1)

          old_grid = '1.2fr .9fr 1fr 1fr .9fr .45fr .45fr .8fr .9fr 32px'
          new_grid = '1.2fr .9fr 1fr 1fr .9fr .45fr .45fr .8fr .9fr .9fr 32px'
          text = text.replace(old_grid, new_grid)

          old_header = '''            <span>Discountable</span>\n            <span />'''
          new_header = '''            <span>Discountable</span>\n            <span>NonDiscountable</span>\n            <span />'''
          if old_header in text and "<span>NonDiscountable</span>" not in text:
              text = text.replace(old_header, new_header, 1)

          button_marker = '''              <button\n                type="button"\n                onClick={() =>\n                  removeUnit(unit)\n                }'''

          non_discountable_cell = '''              <strong>\n                {unit.nonDiscountable !== null &&\n                unit.nonDiscountable !== undefined\n                  ? unit.nonDiscountable.toLocaleString("en-GB", {\n                      minimumFractionDigits: 2,\n                      maximumFractionDigits: 2,\n                    })\n                  : "—"}\n              </strong>\n\n'''

          if "unit.nonDiscountable" not in text:
              if button_marker not in text:
                  raise SystemExit("Could not find unit table action button")
              text = text.replace(button_marker, non_discountable_cell + button_marker, 1)

          if text == original:
              raise SystemExit("No changes were made")

          path.write_text(text, encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "src/WindowCosting.jsx", ".github/workflows/update-window-costing.yml"], check=True)
          subprocess.run(["git", "commit", "-m", "feat: show NonDiscountable in WindowCosting"], check=True)
          subprocess.run(["git", "rm", ".github/workflows/update-window-costing.yml"], check=True)
          subprocess.run(["git", "commit", "-m", "chore: remove temporary update workflow"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
