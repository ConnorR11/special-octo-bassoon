name: Update EPVS UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-epvs-ui:
    if: ${{ !contains(github.event.head_commit.message, 'Remove EPVS customer details') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove customer details from first EPVS tab
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()
          start_marker = '''              <div>\n                <h3 style={{ margin: "0 0 14px", fontSize: 15, color: "#172554" }}>\n                  Customer details\n                </h3>'''
          start = text.find(start_marker)
          if start == -1:
              raise SystemExit('Customer details block not found')
          end_marker = '''              <div>\n                <h3 style={{ margin: "0 0 14px", fontSize: 15, color: "#172554" }}>\n                  Electricity\n                </h3>'''
          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('Electricity section not found')
          text = text[:start] + text[end:]
          text = text.replace('{ title: "Customer", icon: Home },', '{ title: "Energy", icon: Zap },', 1)
          text = text.replace('''            title="Customer"\n            subtitle="Customer details, electricity usage and existing solar PV."''', '''            title="Energy"\n            subtitle="Electricity usage and existing solar PV."''', 1)
          path.write_text(text)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove EPVS customer details"
          git push
