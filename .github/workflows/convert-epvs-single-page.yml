name: Update EPVS UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-epvs-ui:
    if: ${{ !contains(github.event.head_commit.message, 'Update EPVS UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update battery and inverter UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          section_start = text.find('BATTERY & INVERTER')
          if section_start == -1:
              raise SystemExit('Could not find BATTERY & INVERTER section')

          section_end = text.find('/* =================================================', section_start + 20)
          if section_end == -1:
              raise SystemExit('Could not find end of BATTERY & INVERTER section')

          block = text[section_start:section_end]

          # Remove the visible EPVS modelling-assumption inputs while leaving
          # the underlying data fields and calculation logic untouched.
          assumption_labels = [
              'Battery DoD',
              'Battery round-trip efficiency',
              'Battery degradation',
              'Battery warranty',
              'Inverter EU efficiency',
              'Solar degradation',
              'Solar warranty',
              'Existing solar self-consumption',
          ]
          for label in assumption_labels:
              pattern = r'\s*<Input\b[^>]*label=["\\\']' + re.escape(label) + r'[^>]*\/>'
              block = re.sub(pattern, '', block, flags=re.I)

          # Remove common assumption-section headings/descriptions if present.
          block = re.sub(r'\s*<h3[^>]*>\s*EPVS[^<]*(?:<[^>]+>[^<]*)*<\/h3>', '', block, flags=re.I)
          block = re.sub(r'\s*<p[^>]*>\s*Manufacturer values[^<]*<\/p>', '', block, flags=re.I)

          # Put the remaining battery and inverter inputs inside one Card.
          # Remove Card wrappers inside this section, then add one shared Card.
          block = re.sub(r'<Card(?:\s+[^>]*)?>', '', block)
          block = block.replace('</Card>', '')

          marker = 'BATTERY & INVERTER'
          marker_pos = block.find(marker)
          if marker_pos == -1:
              raise SystemExit('Battery/inverter marker disappeared unexpectedly')
          line_end = block.find('\n', marker_pos)
          if line_end == -1:
              raise SystemExit('Could not locate battery/inverter marker line')

          block = block[:line_end + 1] + '        <Card>\n' + block[line_end + 1:]

          # Close the shared Card immediately before the next major section.
          block = block.rstrip() + '\n        </Card>\n\n'

          text = text[:section_start] + block + text[section_end:]
          path.write_text(text)
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx .github/workflows/convert-epvs-single-page.yml
          git diff --cached --quiet && exit 0
          git commit -m "Update EPVS UI"
          git push
