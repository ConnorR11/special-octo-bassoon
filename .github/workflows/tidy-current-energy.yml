name: Update Octopus Flux card layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Update Octopus Flux card layout [automated]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Octopus Flux card header
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          start_marker = '''                  <Card
            title="New Octopus Standard Flux"
            subtitle="Enter the current Flux rates from the Octopus Energy website."
          >'''

          end_marker = '''            <div
              style={{
                display: "grid",
                gridTemplateColumns: "1.2fr 1fr 1fr",
'''

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start == -1 or end == -1:
              raise SystemExit(f'Could not locate Octopus Flux card section: start={start}, end={end}')

          new_header = '''                  <Card
            title="Get current Octopus Flux rates"
            subtitle="Uses the customer postcode to identify the electricity region and retrieves the current Flux import and export rates from Octopus."
          >
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                gap: 16,
                marginBottom: 12,
                paddingBottom: 12,
                borderBottom: "1px solid #e2e8f0",
              }}
            >
              <div
                style={{
                  fontSize: 11,
                  color: "#64748b",
                }}
              >
                {data.fluxRatesRetrievedAt && (
                  <span>
                    Retrieved {new Date(data.fluxRatesRetrievedAt).toLocaleString("en-GB")}
                  </span>
                )}
              </div>

              <button
                type="button"
                onClick={getCurrentFluxRates}
                disabled={loadingFluxRates}
                style={{
                  ...styles.primary,
                  opacity: loadingFluxRates ? 0.65 : 1,
                  whiteSpace: "nowrap",
                  flexShrink: 0,
                }}
              >
                <RotateCcw size={15} />
                {loadingFluxRates ? "Getting rates…" : "Get current rates"}
              </button>
            </div>

            {fluxRateError && (
              <div
                style={{
                  marginBottom: 12,
                  padding: "10px 12px",
                  borderRadius: 8,
                  background: "#fef2f2",
                  border: "1px solid #fecaca",
                  color: "#b91c1c",
                  fontSize: 12,
                }}
              >
                {fluxRateError}
              </div>
            )}

'''

          text = text[:start] + new_header + text[end:]
          path.write_text(text)

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/EPVSCalculator.jsx .github/workflows/tidy-current-energy.yml
          git rm .github/workflows/tidy-current-energy.yml
          git commit -m 'Update Octopus Flux card layout [automated]'
          git push
