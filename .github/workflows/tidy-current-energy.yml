name: Tidy Current Energy layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Tidy Current Energy layout [automated]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Energy card layout
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          start_marker = '''                  <Card
            title="Energy"
            subtitle="Electricity usage and existing solar PV."
          >'''
          end_marker = '''       {/* =================================================
    SOLAR PV
    ================================================= */}'''

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start == -1 or end == -1:
              raise SystemExit(f'Could not locate Energy card: start={start}, end={end}')

          block = text[start:end]

          block = block.replace('title="Energy"', 'title="Current Energy"', 1)
          block = block.replace('label="Current import rate (p/kWh)"', 'label="Import rate (p/kWh)"', 1)
          block = block.replace('label="Current export rate (p/kWh)"', 'label="Export rate (p/kWh)"', 1)
          block = block.replace('label="Current standing charge (p/day)"', 'label="Standing charge (p/day)"', 1)

          electricity_marker = '''              <div style={styles.grid}>'''
          compact_grid = '''              <div
                style={{
                  display: "grid",
                  gridTemplateColumns: "repeat(4, minmax(0, 1fr))",
                  gap: 12,
                }}
              >'''

          if electricity_marker not in block:
              raise SystemExit('Could not locate Electricity input grid')

          block = block.replace(electricity_marker, compact_grid, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)

      - name: Commit changes and remove temporary workflow
        run: |
          rm -f .github/workflows/tidy-current-energy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/EPVSCalculator.jsx .github/workflows/tidy-current-energy.yml
          git commit -m 'Tidy Current Energy layout [automated]'
          git push
