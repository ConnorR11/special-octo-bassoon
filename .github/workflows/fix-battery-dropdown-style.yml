name: Fix battery and inverter dropdown styling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-styling:
    if: github.event.head_commit.message != 'fix: T&C title row and spacing'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update T&C title layout
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/contracts/GenerateSolarContract.js")
          text = path.read_text()
          start = text.index('function title(pdf, page, ctx) {')
          end = text.index('\n}\n\nfunction rows', start) + 2
          new = '''function title(pdf, page, ctx) {
            const terms = page.settings?.page_kind === "terms_conditions"
            const titleSize = terms ? 16 : 22
            const titleY = ctx.y + 5

            pdf.setTextColor(...ctx.text)
            pdf.setFont("helvetica", "bold")
            pdf.setFontSize(titleSize)
            pdf.text(page.title || "", ctx.padding, titleY)

            if (page.subtitle) {
              pdf.setFont("helvetica", "normal")
              pdf.setFontSize(7)
              pdf.setTextColor(100, 112, 120)
              if (terms) {
                pdf.text(page.subtitle, ctx.width - ctx.padding, titleY, { align: "right" })
              } else {
                pdf.setFontSize(9)
                pdf.text(page.subtitle, ctx.padding, ctx.y + 11)
              }
            }

            pdf.setFillColor(...ctx.accent)
            pdf.rect(ctx.padding, ctx.y + (terms ? 10 : 15), ctx.width - ctx.padding * 2, 1.2, "F")
          }'''
          text = text[:start] + new + text[end:]
          text = text.replace('const top = ctx.y + 28', 'const top = ctx.y + 18', 1)
          path.write_text(text)

      - name: Update dropdown styling
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/EPVSCalculator.jsx")
          text = path.read_text()

          style = '''
        style={{
          width: "100%",
          boxSizing: "border-box",
          padding: "9px 8px",
          border: "1px solid #cbd5e1",
          borderRadius: 7,
          background: "#ffffff",
          color: "#172554",
          fontSize: 12,
          outline: "none",
        }}'''

          battery_marker = '      <select\n        value={data.batteryCapacity}'
          inverter_marker = '      <select\n        value={data.inverterCapacity}'

          for marker in (battery_marker, inverter_marker):
              start = text.find(marker)
              if start == -1:
                  raise SystemExit(f"Could not find select: {marker}")

              select_end = text.find('      >', start)
              if select_end == -1:
                  raise SystemExit("Could not find select opening tag end")

              opening = text[start:select_end]
              if 'style={{' not in opening:
                  opening = opening + style
                  text = text[:start] + opening + text[select_end:]

          path.write_text(text)

      - name: Migrate sales presenter code to template tables
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/components/AppointmentActions.jsx
            src/components/DatabaseSalesPresenter.jsx
            src/components/DatabaseSalesPresenterV2.jsx
            src/pages/SalesPresentations.jsx
          )
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              sed -i 's/sales_presentation_slides/template_pages/g; s/sales_presentations/templates/g' "$file"
            fi
          done

      - name: Commit changes and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-battery-dropdown-style.yml
          rm -f .github/workflows/migrate-presenter-tables.yml
          rm -f .github/workflows/apply-tc-title-layout.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: T&C title row and spacing"
          git push
