name: Patch Sales Rep ID

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch webhook
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("api/pipedrive-webhooks/deal-updated.js")
          text = path.read_text()
          old = '    const salesperson = await getSalespersonName(pipedriveToken, getCustomFieldValue(deal, fields.salesperson.key))'
          new = '''    const salespersonRaw = getCustomFieldValue(deal, fields.salesperson.key)\n    const salespersonValue = unwrapValue(salespersonRaw)\n    const salesperson = salespersonValue && typeof salespersonValue === "object"\n      ? String(salespersonValue.id ?? salespersonValue.user_id ?? salespersonValue.value ?? "").trim() || null\n      : (salespersonValue === null || salespersonValue === undefined || salespersonValue === "" ? null : String(salespersonValue).trim())'''
          if old not in text:
              raise SystemExit("Target Sales Rep mapping was not found; no changes made.")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit webhook change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/pipedrive-webhooks/deal-updated.js
          git commit -m "Store Pipedrive Sales Rep ID"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/patch-salesperson.yml
          git commit -m "Remove temporary Sales Rep patch workflow"
          git push
