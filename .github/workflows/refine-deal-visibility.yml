name: Refine deal visibility
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine visibility relationship
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = '.or(`id.eq.${viewerId},sales_manager.eq.${viewerId},manager_id.eq.${viewerId},branch_manager.eq.${viewerId}`)'
          new = '.or(`id.eq.${viewerId},sales_manager.eq.${viewerId},branch_manager.eq.${viewerId}`)'
          if old not in s:
              raise SystemExit('Expected visibility expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/refine-deal-visibility.yml
          git commit -m 'Limit deal visibility to sales and branch managers'
          git rm .github/workflows/refine-deal-visibility.yml
          git commit -m 'Remove temporary visibility refinement workflow'
          git push
