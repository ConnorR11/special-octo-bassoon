name: One-time contract EPVS array table

on:
  push:
    paths:
      - '.github/contract-epvs-array-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Solar PV array table to digital contract EPVS page
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/contracts/GenerateSolarContract.js')
          text = path.read_text()

          pattern = re.compile(r'else if\(kind==="epvs"\)\{rows\(pdf,\[\["System size".*?\],ctx\.padding,y,width,ctx\.text,true\)\}else if\(kind==="datasheets"\)')

          replacement = r'''else if(kind==="epvs"){rows(pdf,[["System size",results.systemSize?`${num(results.systemSize,2)} kWp`:"—"],["Annual consumption",data.annualConsumption?`${num(data.annualConsumption)} kWh`:"—"],["Estimated generation",results.generation?`${num(results.generation)} kWh`:"—"],["Solar self-consumption",results.solarSelfConsumption?`${num(results.solarSelfConsumption)} kWh`:"—"],["Estimated export",results.exportKwh?`${num(results.exportKwh)} kWh`:"—"],["Annual saving",money(results.annualSaving)],["Simple payback",results.simplePayback?`${num(results.simplePayback,1)} years`:"—"],["30 year saving",money(results.thirtyYearSavings)],["30 year return",money(results.thirtyYearProfit)]],ctx.padding,y,width,ctx.text,true);y+=7;const solarArrays=Array.isArray(data.arrays)?data.arrays.slice(0,Number(data.numberOfArrays||data.arrays.length)).map((array,index)=>({array,index,calculated:Array.isArray(results.arrays)?results.arrays[index]||{}:{}})).filter(({array})=>Number(array?.panelCount||0)>0):[];if(solarArrays.length){const tableTitleY=y+3;pdf.setTextColor(...ctx.text);pdf.setFont("helvetica","bold");pdf.setFontSize(9);pdf.text("Solar PV array",ctx.padding,tableTitleY);const headers=["Array","Panels","Panel Wp","Orientation (°)","Pitch (°)","Irradiance / Kk","SF","System size (kWp)","Generation (kWh)"];const tableY=tableTitleY+5;const tableWidths=[14,14,17,23,17,25,14,25,29];const tableX=ctx.padding;const headerHeight=8;const rowHeight=7;let tx=tableX;pdf.setFont("helvetica","bold");pdf.setFontSize(5.8);headers.forEach((heading,index)=>{pdf.setFillColor(...ctx.accent);pdf.rect(tx,tableY,tableWidths[index],headerHeight,"F");pdf.setTextColor(255,255,255);const lines=pdf.splitTextToSize(heading,tableWidths[index]-2);pdf.text(lines.slice(0,2),tx+tableWidths[index]/2,tableY+(lines.length>1?3:5),{align:"center"});tx+=tableWidths[index]});let rowY=tableY+headerHeight;solarArrays.forEach(({array,index,calculated})=>{const values=[`Array ${index+1}`,num(array.panelCount),`${num(array.panelWattage)} W`,`${num(array.orientation)}°`,`${num(array.pitch)}°`,num(array.irradiance,2),num(array.shading,2),`${num(calculated.systemSize,2)} kWp`,num(calculated.generation,2)];tx=tableX;values.forEach((value,cellIndex)=>{pdf.setFillColor(cellIndex%2===0?247:255,cellIndex%2===0?249:255,cellIndex%2===0?250:255);pdf.setDrawColor(230,235,240);pdf.rect(tx,rowY,tableWidths[cellIndex],rowHeight,"FD");pdf.setTextColor(...ctx.text);pdf.setFont("helvetica",cellIndex===0?"bold":"normal");pdf.setFontSize(5.9);pdf.text(String(value),tx+tableWidths[cellIndex]/2,rowY+4.6,{align:"center"});tx+=tableWidths[cellIndex]});rowY+=rowHeight});y=rowY+6}}else if(kind==="datasheets")'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Expected EPVS page renderer block not found; refusing to modify the file.')
          path.write_text(updated)

      - name: Commit change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-contract-epvs-array.yml .github/contract-epvs-array-trigger.txt
          git add src/contracts/GenerateSolarContract.js .github/workflows/one-time-contract-epvs-array.yml .github/contract-epvs-array-trigger.txt
          git commit -m 'Add Solar PV array table to digital contract EPVS page'
          git push
