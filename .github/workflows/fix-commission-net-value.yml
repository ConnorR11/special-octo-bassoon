name: Fix commission net value rollup

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix commission net value rollup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update net value rollup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/SalesCommission.jsx')
          text = path.read_text()
          old = '  const totalNetSalesValue = filtered.reduce((total, { deal, type }) => total + (type === "COMMS" ? getNetSalesValue(deal) : 0), 0)'
          new = '  const totalNetSalesValue = filtered.reduce((total, { deal, type }) => total + (type === "COMMS" && getCommission(deal) !== null ? getNetSalesValue(deal) : 0), 0)'
          if old not in text:
              raise SystemExit('Target line not found; no changes made.')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/SalesCommission.jsx
          git commit -m 'Fix commission net value rollup'
          git push
