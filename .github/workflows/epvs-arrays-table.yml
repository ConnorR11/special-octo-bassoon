name: Tidy EPVS Energy card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Tidy EPVS Energy card [automated]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restyle Energy card
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          start_marker = '''                  <Card
            title="Energy"
            subtitle="Electricity usage and existing solar PV."
          >'''
          end_marker = '''       {/* =================================================
    SOLAR PV
    ================================================= */}'''

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start == -1 or end == -1:
              raise SystemExit(f'Could not locate Energy card boundaries: start={start}, end={end}')

          replacement = '''                  <Card
            title="Energy"
            subtitle="Electricity usage and existing solar PV."
          >
            <div
              style={{
                border: "1px solid #dbe3ec",
                borderRadius: 10,
                overflow: "hidden",
                background: "#ffffff",
              }}
            >
              <div
                style={{
                  padding: "12px 14px",
                  background: "#f8fafc",
                  borderBottom: "1px solid #dbe3ec",
                  color: "#172554",
                  fontSize: 13,
                  fontWeight: 700,
                }}
              >
                Electricity
              </div>

              <div style={{ padding: 14 }}>
                <div style={styles.grid}>
                  <Input
                    label="Annual electricity consumption (kWh)"
                    type="number"
                    value={data.annualConsumption}
                    onChange={(value) => update("annualConsumption", value)}
                    min={0}
                  />
                  <Input
                    label="Current import rate (p/kWh)"
                    type="number"
                    value={data.importRate}
                    onChange={(value) => update("importRate", value)}
                    min={0}
                    step={0.01}
                  />
                  <Input
                    label="Current export rate (p/kWh)"
                    type="number"
                    value={data.exportRate}
                    onChange={(value) => update("exportRate", value)}
                    min={0}
                    step={0.01}
                  />
                  <Input
                    label="Current standing charge (p/day)"
                    type="number"
                    value={data.standingCharge}
                    onChange={(value) => update("standingCharge", value)}
                    min={0}
                    step={0.01}
                  />
                </div>

                {!hasRequiredEnergyInputs && (
                  <div
                    style={{
                      marginTop: 10,
                      padding: "8px 10px",
                      borderRadius: 7,
                      background: "#fffbeb",
                      border: "1px solid #fde68a",
                      fontSize: 11,
                      color: "#92400e",
                    }}
                  >
                    Enter all four electricity values before continuing to the calculation.
                  </div>
                )}
              </div>

              <div
                style={{
                  padding: "12px 14px",
                  background: "#f8fafc",
                  borderTop: "1px solid #dbe3ec",
                  borderBottom: "1px solid #dbe3ec",
                  color: "#172554",
                  fontSize: 13,
                  fontWeight: 700,
                }}
              >
                Existing solar PV
              </div>

              <div style={{ padding: 14 }}>
                <div style={styles.grid}>
                  <Toggle
                    label="Existing solar PV"
                    value={data.existingSolar}
                    onChange={(value) => update("existingSolar", value)}
                  />
                  {data.existingSolar && (
                    <Input
                      label="Existing annual generation (kWh)"
                      type="number"
                      value={data.existingGeneration}
                      onChange={(value) => update("existingGeneration", value)}
                      min={0}
                    />
                  )}
                  {data.existingSolar && (
                    <Input
                      label="Existing solar self-consumption (%)"
                      type="number"
                      value={data.existingSolarSelfConsumption}
                      onChange={(value) => update("existingSolarSelfConsumption", value)}
                      min={0}
                      max={100}
                      step={1}
                    />
                  )}
                </div>
              </div>
            </div>
          </Card>

'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)

      - name: Remove temporary workflows and commit
        run: |
          rm -f .github/workflows/epvs-arrays-table.yml .github/workflows/tidy-energy-card.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/EPVSCalculator.jsx .github/workflows/epvs-arrays-table.yml .github/workflows/tidy-energy-card.yml
          git commit -m 'Tidy EPVS Energy card [automated]'
          git push
