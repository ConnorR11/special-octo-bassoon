name: Migrate sales presenter tables

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Migrate sales presenter code to template tables'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy presenter table names
        shell: bash
        run: |
          set -euo pipefail

          files=(
            src/components/AppointmentActions.jsx
            src/components/DatabaseSalesPresenter.jsx
            src/components/DatabaseSalesPresenterV2.jsx
            src/pages/SalesPresentations.jsx
          )

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              sed -i 's/sales_presentation_slides/template_pages/g; s/sales_presentations/templates/g' "$file"
            fi
          done

      - name: Remove migration workflow
        run: rm -f .github/workflows/migrate-presenter-tables.yml

      - name: Commit migrated code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AppointmentActions.jsx src/components/DatabaseSalesPresenter.jsx src/components/DatabaseSalesPresenterV2.jsx src/pages/SalesPresentations.jsx .github/workflows/migrate-presenter-tables.yml
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Migrate sales presenter code to template tables"
          git push
