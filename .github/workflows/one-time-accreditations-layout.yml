name: One-time accreditation layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply accreditation layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/contracts/GenerateSolarContract.js')
          s = p.read_text()
          old = '''else if(kind==="accreditations"){const items=Array.isArray(settings.items)?settings.items:[];items.forEach(item=>{pdf.setFillColor(246,248,250);pdf.roundedRect(ctx.padding,y,width,20,3,3,"F");pdf.setTextColor(...ctx.text);pdf.setFont("helvetica","bold");pdf.setFontSize(10);pdf.text(textValue(item.name,"Accreditation"),ctx.padding+7,y+8);pdf.setFont("helvetica","normal");pdf.setFontSize(8);pdf.setTextColor(100,112,120);pdf.text(textValue(item.description,""),ctx.padding+7,y+14);y+=25});body(pdf,page.body,ctx.padding,y+4,width,ctx.text,appointment,epvs)}'''
          new = '''else if(kind==="accreditations"){const items=Array.isArray(settings.items)?settings.items:[];items.forEach((item,index)=>{const rightAligned=index%2===1;const contentX=rightAligned?ctx.padding+width:ctx.padding;const textAlign=rightAligned?"right":"left";const cardTop=y;const cardHeight=27;pdf.setFillColor(246,248,250);pdf.roundedRect(ctx.padding,cardTop,width,cardHeight,3,3,"F");pdf.setTextColor(...ctx.text);pdf.setFont("helvetica","bold");pdf.setFontSize(10);pdf.text(textValue(item.name,"Accreditation"),contentX,cardTop+9,{align:textAlign});pdf.setFont("helvetica","normal");pdf.setFontSize(8);pdf.setTextColor(100,112,120);const description=pdf.splitTextToSize(textValue(item.description,""),width-18);pdf.text(description,contentX,cardTop+15,{align:textAlign,maxWidth:width-18});y+=cardHeight+8});body(pdf,page.body,ctx.padding,y+4,width,ctx.text,appointment,epvs)}'''
          if old not in s:
              raise SystemExit('Expected accreditation renderer block not found; refusing to modify the file.')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/one-time-accreditations-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contracts/GenerateSolarContract.js .github/workflows/one-time-accreditations-layout.yml
          git commit -m 'Alternate accreditation section alignment'
          git push
