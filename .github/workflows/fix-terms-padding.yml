name: Reduce T&C top padding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-terms-padding.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'chore: reduce T&C top padding [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reduce Terms & Conditions padding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/contracts/GenerateSolarContract.js')
          s = p.read_text()
          old = 'const top = ctx.y + 28'
          new = 'const top = ctx.y + 17'
          if old not in s:
              raise SystemExit('Expected T&C top padding expression was not found')
          p.write_text(s.replace(old, new, 1))
          PY

          rm .github/workflows/fix-terms-padding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contracts/GenerateSolarContract.js .github/workflows/fix-terms-padding.yml
          git commit -m 'chore: reduce T&C top padding [skip ci]'
          git push
