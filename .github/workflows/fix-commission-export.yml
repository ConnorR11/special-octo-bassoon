name: Fix commission export permission prop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore commission export permission
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/App.jsx")
          text = path.read_text()
          old = '<SalesCommission deals={commissionDeals} loading={commissionLoading}/>'
          new = '<SalesCommission deals={commissionDeals} loading={commissionLoading} permissionLevel={effectivePermissionLevel}/>'
          if old not in text:
              raise SystemExit("Target SalesCommission component not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git rm .github/workflows/fix-commission-export.yml
          git commit -m "Restore commission export permission"
          git push