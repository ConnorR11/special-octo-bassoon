name: Add window totals

on:
  push:
    paths:
      - .github/window-total-trigger

permissions:
  contents: write

jobs:
  update-window-costing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add totals row
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/WindowCosting.jsx")
          text = path.read_text()

          totals = '''  const unitTotals = useMemo(() => {
            return units.reduce(
              (totals, unit) => {
                totals.discountable += Number(unit.discountable) || 0
                totals.nonDiscountable += Number(unit.nonDiscountable) || 0
                return totals
              },
              {
                discountable: 0,
                nonDiscountable: 0,
              }
            )
          }, [units])

'''

          if "const unitTotals = useMemo" not in text:
              marker = "  async function removeUnit(unit) {"
              if marker not in text:
                  raise SystemExit("Could not find removeUnit marker")
              text = text.replace(marker, totals + marker, 1)

          total_row = '''          <div
            style={{
              display: "grid",
              gridTemplateColumns:
                "1.2fr .9fr 1fr 1fr .9fr .45fr .45fr .8fr .9fr .9fr 32px",
              gap: "10px",
              alignItems: "center",
              padding: "12px 12px",
              borderTop: "2px solid #dfe4e8",
              background: "#f8fafc",
              fontSize: "10px",
              color: "#222",
              fontWeight: 700,
            }}
          >
            <strong>Total</strong>
            <span />
            <span />
            <span />
            <span />
            <span />
            <span />
            <span />
            <strong>
              {unitTotals.discountable.toLocaleString("en-GB", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
              })}
            </strong>
            <strong>
              {unitTotals.nonDiscountable.toLocaleString("en-GB", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
              })}
            </strong>
            <span />
          </div>
'''

          if '<strong>Total</strong>' not in text:
              marker = '''          ))}
        </div>
      )}'''
              if marker not in text:
                  raise SystemExit("Could not find units table ending")
              text = text.replace(
                  marker,
                  "          ))\n\n" + total_row + "        </div>\n      )}",
                  1,
              )

          path.write_text(text)
          PY

      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/WindowCosting.jsx
          git rm .github/window-total-trigger .github/workflows/add-window-totals.yml
          git diff --cached --quiet || git commit -m "feat: add window unit totals"
          git push origin main
