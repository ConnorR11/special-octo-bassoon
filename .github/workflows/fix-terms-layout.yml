name: Fix T&C Column Flow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-terms-layout:
    if: ${{ !contains(github.event.head_commit.message, 'fix: flow T&C text continuously') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update T&C renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/contracts/GenerateSolarContract.js')
          source = path.read_text()

          replacement = r'''function drawTermsConditions(
  pdf,
  page,
  ctx,
  appointment,
  epvs
) {
  const settings = page.settings || {}
  const width = ctx.width - ctx.padding * 2
  const gap = Number(settings.column_gap_mm || 6)
  const columnWidth = (width - gap) / 2
  const bottom = ctx.height - 17
  const top = ctx.padding + 18
  const availableHeight = bottom - top

  let fontSize = Number(settings.font_size || 6.5)
  let lineHeight = Number(settings.line_height || 3.1)
  const sectionSpacing = Number(settings.section_spacing || 2)
  const headingSize = Number(settings.heading_font_size || 7)

  pdf.setTextColor(...ctx.text)
  pdf.setFont('helvetica', 'bold')
  pdf.setFontSize(7)
  pdf.text('HOMESHIELD SCOTLAND LIMITED', ctx.padding, ctx.padding + 3)
  pdf.setFont('helvetica', 'normal')
  pdf.setFontSize(6.5)
  pdf.text(
    'SOLAR PV AND BATTERY INSTALLATIONS IN SCOTLAND',
    ctx.width - ctx.padding,
    ctx.padding + 3,
    { align: 'right' }
  )

  pdf.setFont('helvetica', 'bold')
  pdf.setFontSize(15)
  pdf.setTextColor(...ctx.text)
  pdf.text(
    page.title || 'GENERAL TERMS AND CONDITIONS',
    ctx.padding,
    ctx.padding + 11
  )

  if (page.subtitle) {
    pdf.setFont('helvetica', 'normal')
    pdf.setFontSize(6.5)
    pdf.setTextColor(90, 100, 108)
    pdf.text(
      page.subtitle,
      ctx.width - ctx.padding,
      ctx.padding + 11,
      { align: 'right' }
    )
  }

  pdf.setDrawColor(...ctx.accent)
  pdf.setLineWidth(0.35)
  pdf.line(
    ctx.padding,
    ctx.padding + 14,
    ctx.width - ctx.padding,
    ctx.padding + 14
  )

  const raw = interpolate(String(page.body || ''), appointment, epvs)
    .replace(/\r/g, '')
    .trim()

  const paragraphs = raw
    .split(/\n\s*\n/)
    .map((value) => value.trim())
    .filter(Boolean)

  const sections = []
  paragraphs.forEach((paragraph) => {
    const parts = paragraph
      .split(/(?=\n?\d+\.\s+)/g)
      .map((part) => part.trim())
      .filter(Boolean)
    sections.push(...parts)
  })

  const buildLines = (size) => {
    const lines = []

    sections.forEach((section) => {
      const normal = String(section).replace(/\s+/g, ' ').trim()
      if (!normal) return

      const numbered = normal.match(/^(\d+\.\s+)(.*)$/)
      const sectionMatch = numbered
        ? numbered[2].match(/^(.+?\.)\s+(.*)$/)
        : null

      if (!numbered) {
        pdf.setFont('helvetica', 'normal')
        pdf.setFontSize(size)
        pdf.splitTextToSize(normal, columnWidth).forEach((text) => {
          lines.push({ text, boldPrefix: '' })
        })
        lines.push({ text: '', boldPrefix: '', spacing: sectionSpacing })
        return
      }

      const prefix = numbered[1] + (sectionMatch ? sectionMatch[1] + ' ' : '')
      const bodyText = sectionMatch ? sectionMatch[2] : numbered[2]

      pdf.setFont('helvetica', 'bold')
      pdf.setFontSize(headingSize)
      const prefixWidth = pdf.getTextWidth(prefix)

      pdf.setFont('helvetica', 'normal')
      pdf.setFontSize(size)

      const firstWidth = Math.max(10, columnWidth - prefixWidth)
      const bodyLines = pdf.splitTextToSize(bodyText, firstWidth)

      if (!bodyLines.length) {
        lines.push({ text: '', boldPrefix: prefix })
      } else {
        lines.push({ text: bodyLines[0], boldPrefix: prefix })
        pdf.setFont('helvetica', 'normal')
        pdf.setFontSize(size)
        pdf.splitTextToSize(bodyText, columnWidth).slice(1).forEach((text) => {
          lines.push({ text, boldPrefix: '' })
        })
      }

      lines.push({ text: '', boldPrefix: '', spacing: sectionSpacing })
    })

    return lines
  }

  let lines = buildLines(fontSize)

  for (let attempt = 0; attempt < 8; attempt += 1) {
    const usableRows = (availableHeight * 2) / lineHeight
    const requiredRows = lines.reduce(
      (total, line) => total + (line.spacing ? line.spacing / lineHeight : 1),
      0
    )

    if (requiredRows <= usableRows) break

    const scale = Math.sqrt(usableRows / requiredRows)
    fontSize = Math.max(5.1, fontSize * Math.min(0.96, scale))
    lineHeight = Math.max(2.35, lineHeight * Math.min(0.96, scale))
    lines = buildLines(fontSize)
  }

  let column = 0
  let x = ctx.padding
  let y = top

  const nextColumn = () => {
    column += 1
    x = ctx.padding + columnWidth + gap
    y = top
  }

  lines.forEach((line) => {
    if (column > 1) return

    if (line.spacing) {
      y += line.spacing
      return
    }

    if (y + lineHeight > bottom) {
      nextColumn()
      if (column > 1) return
    }

    if (line.boldPrefix) {
      pdf.setTextColor(...ctx.text)
      pdf.setFont('helvetica', 'bold')
      pdf.setFontSize(headingSize)
      const prefixWidth = pdf.getTextWidth(line.boldPrefix)
      pdf.text(line.boldPrefix, x, y)

      pdf.setFont('helvetica', 'normal')
      pdf.setFontSize(fontSize)
      pdf.text(line.text, x + prefixWidth, y)
    } else {
      pdf.setTextColor(...ctx.text)
      pdf.setFont('helvetica', 'normal')
      pdf.setFontSize(fontSize)
      pdf.text(line.text, x, y)
    }

    y += lineHeight
  })
}
'''

          pattern = r"function drawTermsConditions\([\s\S]*?\n\}\n\nasync function renderPage\("
          updated, count = re.subn(pattern, replacement + "\nasync function renderPage(", source, count=1)

          if count != 1:
              raise SystemExit('Could not locate drawTermsConditions renderer')

          path.write_text(updated)
          PY

      - name: Commit renderer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contracts/GenerateSolarContract.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: flow T&C text continuously"
          git push