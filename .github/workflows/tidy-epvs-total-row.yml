name: Tidy EPVS total generation row

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move total generation into table footer
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          # Only act if the separate green total block still exists.
          marker = '  {/* TOTAL */}'
          start = text.find(marker)
          if start == -1:
              print('Total block already moved; nothing to do.')
              raise SystemExit(0)

          card_end = text.find('\n</Card>', start)
          if card_end == -1:
              raise SystemExit('Could not find the end of the Solar PV card.')

          total_block = text[start:card_end]

          footer = '''  <tfoot>\n    <tr style={{ background: "#e8f5eb", color: "#315b28" }}>\n      <td\n        colSpan={8}\n        style={{\n          padding: "14px 10px",\n          borderTop: "1px solid #bbdfc1",\n          fontWeight: 700,\n        }}\n      >\n        <div style={{ fontSize: 12 }}>Total overall generation</div>\n        <div\n          style={{\n            marginTop: 3,\n            fontSize: 11,\n            fontWeight: 500,\n            color: "#4d7047",\n          }}\n        >\n          {results.numberOfArrays} array\n          {results.numberOfArrays !== 1 ? "s" : ""}\n        </div>\n      </td>\n      <td\n        style={{\n          padding: "14px 10px",\n          borderTop: "1px solid #bbdfc1",\n          textAlign: "right",\n          whiteSpace: "nowrap",\n          fontSize: 16,\n          fontWeight: 800,\n          color: "#26783a",\n        }}\n      >\n        {Number(results.generation || 0).toFixed(2)} kWh\n      </td>\n    </tr>\n  </tfoot>'''

          # Remove the old total card.
          new_text = text[:start] + text[card_end:]

          # Insert the footer immediately before the Solar PV table closing tag.
          solar_end = new_text.find('\n</Card>', start)
          table_close = new_text.rfind('    </table>', start, solar_end)
          if table_close == -1:
              raise SystemExit('Could not find the Solar PV table closing tag.')

          new_text = new_text[:table_close] + footer + '\n' + new_text[table_close:]
          path.write_text(new_text)

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx .github/workflows/tidy-epvs-total-row.yml
          git rm .github/workflows/tidy-epvs-total-row.yml
          git commit -m "Tidy EPVS total generation row"
          git push
