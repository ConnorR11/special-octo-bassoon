name: Apply deal visibility patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch App.jsx
        run: python .github/patch_deal_visibility.py
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/apply-deal-visibility.yml .github/patch_deal_visibility.py
          git commit -m 'Fix deal visibility for reps and managers' || exit 0
          git rm .github/workflows/apply-deal-visibility.yml .github/patch_deal_visibility.py
          git commit -m 'Remove temporary deal visibility patch workflow'
          git push
