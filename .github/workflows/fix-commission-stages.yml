name: Apply commission stage exclusions

on:
  push:
    paths:
      - .github/workflows/fix-commission-stages.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update commission query
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = '.not("pipedrive_stage", "in", "(Decline,Customer Cancelled,RTS)")'
          new = '.not("pipedrive_stage", "in", "(Decline,Customer Cancelled,Returned To Sales,Awaiting Funds,On Hold,Pending Cancellation)")'
          if old not in s:
              raise SystemExit('Expected commission query was not found; no changes made.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit App.jsx and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-commission-stages.yml
          git add src/App.jsx
          git commit -m "Exclude non-payable commission stages"
          git push