name: Fix commission filter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch commission loading
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text()
          old = '      setCommissionDeals(results)'
          new = '''      const excludedCommissionStages = new Set(["decline", "customer cancelled", "returned to sales", "awaiting funds", "on hold", "pending cancellation"])
          const commissionEligible = results.filter(deal => {
            const stage = String(deal?.pipedrive_stage ?? "").trim().replace(/\\s+/g, " ").toLowerCase()
            return !excludedCommissionStages.has(stage)
          })
          setCommissionDeals(commissionEligible)'''
          if old in text:
              text = text.replace(old, new, 1)
          old = '    if (newPage === "contracts") { setQuery(""); setStatus("all"); loadContracts(0, "", "all") }'
          new = '''    if (newPage === "contracts") { setQuery(""); setStatus("all"); loadContracts(0, "", "all") }
    if (newPage === "commissions") loadCommissionDeals()'''
          if old in text and 'if (newPage === "commissions") loadCommissionDeals()' not in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix commission source filtering"
          git push
