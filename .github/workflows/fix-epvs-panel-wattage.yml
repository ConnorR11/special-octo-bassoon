name: Fix EPVS panel wattage and irradiance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock panel wattage and irradiance
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/EPVSCalculator.jsx")
          text = path.read_text()

          # Set the fixed panel specification for all newly-created arrays.
          text = text.replace("panelWattage: 415,", "panelWattage: 460,")

          # Replace the existing panel wattage input wherever it appears in the table.
          panel_pattern = re.compile(
              r'<input\s+type="number"\s+value=\{array\.panelWattage\}.*?/>',
              re.DOTALL,
          )
          panel_replacement = '''<input
                    type="number"
                    value={460}
                    readOnly
                    aria-label="Panel wattage (Wp)"
                    style={{
                      ...inputStyle,
                      background: "#f1f5f9",
                      cursor: "not-allowed",
                    }}
                  />'''

          text, panel_count = panel_pattern.subn(panel_replacement, text, count=1)
          if panel_count != 1:
              raise SystemExit(f"Expected 1 panel wattage input, found {panel_count}")

          # Replace the irradiance input with a read-only display while keeping
          # the calculated value supplied by the calculator logic.
          irr_pattern = re.compile(
              r'<input\s+type="number"\s+value=\{array\.irradiance\}.*?/>',
              re.DOTALL,
          )
          irr_replacement = '''<input
                    type="number"
                    value={array.irradiance}
                    readOnly
                    aria-label="Irradiance / Kk"
                    style={{
                      ...inputStyle,
                      background: "#f1f5f9",
                      cursor: "not-allowed",
                    }}
                  />'''

          text, irr_count = irr_pattern.subn(irr_replacement, text, count=1)
          if irr_count != 1:
              raise SystemExit(f"Expected 1 irradiance input, found {irr_count}")

          path.write_text(text)

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit source change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx
          git rm .github/workflows/fix-epvs-panel-wattage.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "Lock EPVS panel wattage and irradiance"
          git push
