name: Apply T&C title layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tc-title-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: T&C title row and spacing [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/contracts/GenerateSolarContract.js')
          text = path.read_text()
          start = text.index('function title(pdf, page, ctx) {')
          end = text.index('\n}\n\nfunction rows', start) + 2
          new = '''function title(pdf, page, ctx) {
            const terms = page.settings?.page_kind === "terms_conditions"
            const titleSize = terms ? 16 : 22
            const titleY = ctx.y + 5

            pdf.setTextColor(...ctx.text)
            pdf.setFont("helvetica", "bold")
            pdf.setFontSize(titleSize)
            pdf.text(page.title || "", ctx.padding, titleY)

            if (page.subtitle) {
              pdf.setFont("helvetica", "normal")
              pdf.setFontSize(7)
              pdf.setTextColor(100, 112, 120)
              if (terms) {
                pdf.text(page.subtitle, ctx.width - ctx.padding, titleY, { align: "right" })
              } else {
                pdf.setFontSize(9)
                pdf.text(page.subtitle, ctx.padding, ctx.y + 11)
              }
            }

            pdf.setFillColor(...ctx.accent)
            pdf.rect(ctx.padding, ctx.y + (terms ? 10 : 15), ctx.width - ctx.padding * 2, 1.2, "F")
          }'''
          text = text[:start] + new + text[end:]
          text = text.replace('const top = ctx.y + 28', 'const top = ctx.y + 18', 1)
          path.write_text(text)
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/apply-tc-title-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contracts/GenerateSolarContract.js .github/workflows/apply-tc-title-layout.yml
          git commit -m 'fix: T&C title row and spacing [skip ci]'
          git push
