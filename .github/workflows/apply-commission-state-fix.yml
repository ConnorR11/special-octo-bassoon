name: Apply commission state fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.jsx
        run: >-
          python -c 'from pathlib import Path; p=Path("src/App.jsx"); s=p.read_text(); old="  function handleDealUpdated(updatedDeal) { setContracts(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract)); setAllDeals(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract)); setCommissionDeals(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract)); setSelected(updatedDeal) }"; new="  function handleDealUpdated(updatedDeal) {\n    const excludedCommissionStages = new Set([\"decline\", \"customer cancelled\", \"returned to sales\", \"awaiting funds\", \"on hold\", \"pending cancellation\"])\n    const stage = String(updatedDeal?.pipedrive_stage ?? \"\").trim().replace(/\\s+/g, \" \").toLowerCase()\n    const shouldRemoveFromCommissions = excludedCommissionStages.has(stage)\n    setContracts(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract))\n    setAllDeals(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract))\n    setCommissionDeals(current => shouldRemoveFromCommissions ? current.filter(contract => contract.id !== updatedDeal.id) : current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract))\n    setSelected(updatedDeal)\n  }"; assert old in s, "target not found"; p.write_text(s.replace(old,new,1))'
      - name: Commit fix to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b commission-stage-fix
          git add src/App.jsx
          git commit -m "Remove excluded stages from commission state"
          git push --set-upstream origin commission-stage-fix
