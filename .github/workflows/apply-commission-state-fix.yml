name: Apply commission state fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.jsx
        run: >-
          python -c 'from pathlib import Path; import re; p=Path("src/App.jsx"); s=p.read_text(); pattern=r"  function handleDealUpdated\\(updatedDeal\\) \\{[^\\n]*\\n"; new="  function handleDealUpdated(updatedDeal) {\n    const excludedCommissionStages = new Set([\"decline\", \"customer cancelled\", \"returned to sales\", \"awaiting funds\", \"on hold\", \"pending cancellation\"])\n    const stage = String(updatedDeal?.pipedrive_stage ?? \"\").trim().replace(/\\\\s+/g, \" \").toLowerCase()\n    const shouldRemoveFromCommissions = excludedCommissionStages.has(stage)\n    setContracts(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract))\n    setAllDeals(current => current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract))\n    setCommissionDeals(current => shouldRemoveFromCommissions ? current.filter(contract => contract.id !== updatedDeal.id) : current.map(contract => contract.id === updatedDeal.id ? updatedDeal : contract))\n    setSelected(updatedDeal)\n  }\n"; assert re.search(pattern,s), "target not found"; p.write_text(re.sub(pattern,new,s,count=1))'
      - name: Commit fix to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B commission-stage-fix
          git add src/App.jsx
          git commit -m "Remove excluded stages from commission state"
          git push --force --set-upstream origin commission-stage-fix
