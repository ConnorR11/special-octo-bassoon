name: Fix Octopus button icon

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Replace loading icon with Octopus logo
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/EPVSCalculator.jsx")
          text = path.read_text(encoding="utf-8")
          old = '                  <RotateCcw size={15} />'

          if old not in text:
              print("Octopus icon already applied; nothing to do.")
              Path(".github/workflows/replace-octopus-button.yml").unlink(missing_ok=True)
              raise SystemExit(0)

          new = '''                  <svg
                    width="17"
                    height="17"
                    viewBox="0 0 32 32"
                    aria-hidden="true"
                    style={{ display: "block" }}
                  >
                    <circle cx="16" cy="13" r="9.5" fill="#f33fc9" />
                    <path d="M8 15c-1.8 3-4.8 3.2-5.8 2.2 2.8-.2 3.6-2.5 4.2-4.1M24 15c1.8 3 4.8 3.2 5.8 2.2-2.8-.2-3.6-2.5-4.2-4.1M11 20c-1.4 3.4-3.8 4.8-5.4 3.8 1.7-.9 1.9-3.2 1.9-4.7M21 20c1.4 3.4 3.8 4.8 5.4 3.8-1.7-.9-1.9-3.2-1.9-4.7M14 21.5c-.1 3.7-1.3 5.1-2.6 5.2 1.3-1.3 1-3.2.8-4.7M18 21.5c.1 3.7 1.3 5.1 2.6 5.2-1.3-1.3-1-3.2-.8-4.7" fill="none" stroke="#f33fc9" strokeWidth="3" strokeLinecap="round" />
                    <circle cx="12.5" cy="12.5" r="1.4" fill="#24105f" />
                    <circle cx="19.5" cy="12.5" r="1.4" fill="#24105f" />
                    <path d="M13 16c1.8 1.5 4.2 1.5 6 0" fill="none" stroke="#24105f" strokeWidth="1.5" strokeLinecap="round" />
                  </svg>'''

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/replace-octopus-button.yml").unlink(missing_ok=True)

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx .github/workflows/replace-octopus-button.yml
          git diff --cached --quiet && exit 0
          git commit -m "Replace Flux button loading icon with Octopus logo"
          git push origin main
