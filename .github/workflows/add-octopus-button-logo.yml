name: Add Octopus logo to Flux button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add logo and update button
        run: |
          mkdir -p public
          cat > public/octopus-logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
            <rect width="600" height="600" fill="white"/>
            <path fill="#f743d0" d="M300 30c-138 0-245 94-245 222 0 77 30 121 62 164-30 10-44 35-25 52 18 17 54 17 75 7-20 25-51 36-47 52 6 23 78 26 125-19 5 35 12 61 55 61s50-26 55-61c47 45 119 42 125 19 4-16-27-27-47-52 21 10 57 10 75-7 19-17 5-42-25-52 32-43 62-87 62-164C545 124 438 30 300 30Z"/>
            <ellipse cx="204" cy="304" rx="58" ry="58" fill="white"/>
            <ellipse cx="396" cy="304" rx="58" ry="58" fill="white"/>
            <ellipse cx="208" cy="312" rx="41" ry="48" fill="#09002f"/>
            <ellipse cx="392" cy="312" rx="41" ry="48" fill="#09002f"/>
            <circle cx="183" cy="292" r="10" fill="white"/>
            <circle cx="367" cy="292" r="10" fill="white"/>
            <path d="M145 214q14-11 27-11" fill="none" stroke="#09002f" stroke-width="12" stroke-linecap="round"/>
            <path d="M428 203q14 0 27 11" fill="none" stroke="#09002f" stroke-width="12" stroke-linecap="round"/>
            <path d="M265 396q35 28 70 0" fill="none" stroke="#09002f" stroke-width="14" stroke-linecap="round"/>
          </svg>
          SVG

          python - <<'PY'
          from pathlib import Path
          path = Path("src/EPVSCalculator.jsx")
          text = path.read_text()
          old = '<RotateCcw size={15} />'
          new = '<img src="/octopus-logo.svg" alt="" aria-hidden="true" style={{ width: 18, height: 18, objectFit: "contain" }} />'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx public/octopus-logo.svg
          git diff --cached --quiet && exit 0
          git commit -m "Use Octopus logo on Flux rates button"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/add-octopus-button-logo.yml
          git commit -m "Remove temporary Octopus logo workflow"
          git push
