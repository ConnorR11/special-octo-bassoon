name: Apply Window Cost Totals To Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-window-costing:
    if: github.event.head_commit.message != 'feat: add window unit cost totals'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add unit totals row
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/WindowCosting.jsx")
          text = path.read_text()

          totals_code = '''  const unitTotals = useMemo(() => {
            return units.reduce(
              (totals, unit) => ({
                discountable:
                  totals.discountable +
                  (Number(unit.discountable) || 0),
                nonDiscountable:
                  totals.nonDiscountable +
                  (Number(unit.nonDiscountable) || 0),
              }),
              {
                discountable: 0,
                nonDiscountable: 0,
              }
            )
          }, [units])

'''

          if "const unitTotals = useMemo" not in text:
              marker = "  async function removeUnit(unit) {"
              if marker not in text:
                  raise SystemExit("Could not find removeUnit marker")
              text = text.replace(marker, totals_code + marker, 1)

          total_row = '''          <div
            style={{
              display: "grid",
              gridTemplateColumns:
                "1.2fr .9fr 1fr 1fr .9fr .45fr .45fr .8fr .9fr .9fr 32px",
              gap: "10px",
              alignItems: "center",
              padding: "12px",
              background: "#fafbfc",
              borderTop: "2px solid #e2e5e8",
              fontSize: "10px",
              color: "#333",
            }}
          >
            <strong
              style={{
                gridColumn: "1 / span 8",
                fontSize: "10px",
                textTransform: "uppercase",
                color: "#59636c",
              }}
            >
              Total
            </strong>

            <strong>
              {unitTotals.discountable.toLocaleString("en-GB", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
              })}
            </strong>

            <strong>
              {unitTotals.nonDiscountable.toLocaleString("en-GB", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
              })}
            </strong>

            <span />
          </div>
'''

          if '<strong>Total</strong>' not in text:
              marker = '''          ))}
        </div>
      )}'''
              if marker not in text:
                  raise SystemExit("Could not find unit table ending")
              text = text.replace(
                  marker,
                  "          ))\n\n" + total_row + "        </div>\n      )}",
                  1,
              )

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/WindowCosting.jsx
          git diff --cached --quiet || git commit -m "feat: add window unit cost totals"
          git push origin HEAD:main
