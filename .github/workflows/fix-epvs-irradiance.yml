name: Convert EPVS calculator to single page

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Convert layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()
          text = text.replace('  ArrowLeft,\n  ArrowRight,\n', '')
          steps_start = text.find('const steps = [')
          if steps_start != -1:
              steps_end = text.find(']\n\nconst createArray', steps_start)
              if steps_end == -1: raise SystemExit('steps end not found')
              text = text[:steps_start] + text[steps_end + 2:]
          text = text.replace('  const [step, setStep] = useState(0)\n', '')
          next_start = text.find('  const next = () => {')
          if next_start != -1:
              return_start = text.find('  return (', next_start)
              if return_start == -1: raise SystemExit('return not found')
              text = text[:next_start] + '  const reset = () => {\n    setData(appointmentInitial)\n  }\n\n' + text[return_start:]
          stepper_start = text.find('        {/* =================================================\n            STEPPER')
          if stepper_start != -1:
              energy = text.find('        {/* =================================================\n            CUSTOMER & ENERGY', stepper_start)
              if energy == -1: raise SystemExit('energy marker not found')
              text = text[:stepper_start] + text[energy:]
          sections = ['CUSTOMER & ENERGY','SOLAR PV','BATTERY & INVERTER','TARIFF','FINANCE','RESULTS']
          for index, title in enumerate(sections):
              opening = f'        {{step === {index} && (\n'
              text = text.replace(opening, '        ', 1)
              next_title = sections[index + 1] if index < 5 else 'FOOTER'
              marker = f'        {{/* =================================================\n            {next_title}'
              marker_pos = text.find(marker)
              if marker_pos == -1: raise SystemExit(f'next marker not found: {title}')
              before = text[:marker_pos]
              close_pos = before.rfind('        )}\n')
              if close_pos == -1: raise SystemExit(f'wrapper close not found: {title}')
              text = before[:close_pos] + before[close_pos + len('        )}\n'):] + text[marker_pos:]
          nav = re.compile(r'          <div\n            style=\{\{\n              display:\n                "flex",\n              gap: 10,\n            \}\}\n          >\n\n            <button\n              type="button"\n              onClick=\{back\}[\s\S]*?          </div>\n')
          text, count = nav.subn('', text, count=1)
          if count == 0 and 'onClick={back}' in text: raise SystemExit('navigation not removed')
          path.write_text(text)
          PY
      - name: Commit layout change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Convert EPVS calculator to single-page layout"
          git push
