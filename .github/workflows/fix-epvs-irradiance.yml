name: Fix EPVS irradiance auto population

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch EPVS calculator
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          import_line = 'import { getIrradiance } from "./epvsIrradianceData"\n'
          if import_line not in text:
              text = text.replace('import { supabase } from "./lib/supabase"\n', 'import { supabase } from "./lib/supabase"\n' + import_line, 1)

          marker = '  const updateArray = (\n'
          effect = '''  const arrayGeometryKey = data.arrays\n    .map((array) => `${array.pitch ?? ""}:${array.orientation ?? ""}`)\n    .join("|")\n\n  // Automatically populate EPVS irradiance from postcode/SAP zone, pitch and orientation.\n  useEffect(() => {\n    const zone = getSapZone(data.postcode, data.sapZone)\n    const zoneCode = zone?.code\n\n    if (!zoneCode) return\n\n    const updatedArrays = data.arrays.map((array) => {\n      const irradiance = getIrradiance(\n        zoneCode,\n        Number(array.pitch || 0),\n        Number(array.orientation || 0)\n      )\n\n      return {\n        ...array,\n        irradiance,\n      }\n    })\n\n    const changed = updatedArrays.some(\n      (array, index) => Number(data.arrays[index]?.irradiance || 0) !== Number(array.irradiance || 0)\n    )\n\n    if (changed) {\n      setData((current) => ({\n        ...current,\n        arrays: updatedArrays,\n      }))\n    }\n  }, [data.postcode, data.sapZone, arrayGeometryKey])\n\n'''

          if 'const arrayGeometryKey = data.arrays' not in text:
              if marker not in text:
                  raise SystemExit('Could not find updateArray marker')
              text = text.replace(marker, effect + marker, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix automatic EPVS irradiance population"
          git push