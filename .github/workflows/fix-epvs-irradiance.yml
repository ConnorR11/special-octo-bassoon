name: Fix EPVS irradiance auto population

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch EPVS calculator
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/EPVSCalculator.jsx')
          text = path.read_text()

          import_line = 'import { getIrradiance } from "./epvsIrradianceData"\n'
          if import_line not in text:
              text = text.replace('import { supabase } from "./lib/supabase"\n', 'import { supabase } from "./lib/supabase"\n' + import_line, 1)

          marker = '  const updateArray = (\n'
          effect = '''  const arrayGeometryKey = data.arrays
    .map((array) => `${array.pitch ?? ""}:${array.orientation ?? ""}`)
    .join("|")

  // Automatically populate EPVS irradiance from postcode/SAP zone, pitch and orientation.
  useEffect(() => {
    const zone = getSapZone(data.postcode, data.sapZone)
    const zoneCode = zone?.code

    if (!zoneCode) return

    const updatedArrays = data.arrays.map((array) => {
      const irradiance = getIrradiance(
        zoneCode,
        Number(array.pitch || 0),
        Number(array.orientation || 0)
      )

      return {
        ...array,
        irradiance,
      }
    })

    const changed = updatedArrays.some(
      (array, index) => Number(data.arrays[index]?.irradiance || 0) !== Number(array.irradiance || 0)
    )

    if (changed) {
      setData((current) => ({
        ...current,
        arrays: updatedArrays,
      }))
    }
  }, [data.postcode, data.sapZone, arrayGeometryKey])

'''
          if 'const arrayGeometryKey = data.arrays' not in text:
              if marker not in text:
                  raise SystemExit('Could not find updateArray marker')
              text = text.replace(marker, effect + marker, 1)

          start = text.find('            <Card\n              title="Battery"')
          end_marker = '          </div>\n\n        {/* =================================================\n            TARIFF'
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Battery/inverter UI block not found')

          replacement = '''            <Card
              title="Battery & Inverter"
              subtitle="Configure the proposed battery and inverter."
            >
              <div style={styles.grid}>
                <label style={styles.field}>
                  <span>Battery configuration</span>
                  <select
                    value={data.batteryCapacity}
                    onChange={(event) =>
                      update(
                        "batteryCapacity",
                        event.target.value === ""
                          ? ""
                          : Number(event.target.value)
                      )
                    }
                  >
                    <option value="">Select battery</option>
                    <option value={0}>No battery</option>
                    <option value={5.12}>1 × 5.12 kWh</option>
                    <option value={10.24}>2 × 5.12 kWh</option>
                    <option value={15.36}>3 × 5.12 kWh</option>
                    <option value={9.4}>1 × 9.4 kWh</option>
                    <option value={18.8}>2 × 9.4 kWh</option>
                    <option value={28.2}>3 × 9.4 kWh</option>
                  </select>
                </label>

                <label style={styles.field}>
                  <span>Inverter capacity (kW)</span>
                  <select
                    value={data.inverterCapacity}
                    onChange={(event) =>
                      update(
                        "inverterCapacity",
                        event.target.value === ""
                          ? ""
                          : Number(event.target.value)
                      )
                    }
                  >
                    <option value="">Select inverter</option>
                    <option value={3.7}>3.7 kW</option>
                    <option value={6}>6 kW</option>
                    <option value={7}>7 kW</option>
                    <option value={10}>10 kW</option>
                  </select>
                </label>
              </div>
            </Card>

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EPVSCalculator.jsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Simplify EPVS battery and inverter UI"
          git push
