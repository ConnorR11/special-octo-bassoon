name: Fix Window Costing Totals

on:
  push:
    paths:
      - '.github/workflows/fix-window-totals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add totals row
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/WindowCosting.jsx')
          text = path.read_text(encoding='utf-8')

          if 'TOTALS ROW - DISCOUNTABLE' in text:
              print('Totals row already present')
              raise SystemExit(0)

          table_start = text.index('          {units.map((unit) => (')
          table_end = text.index('        </div>\n      )\n      }', table_start)

          marker = '''
          {/* TOTALS ROW - DISCOUNTABLE */}
          <div
            style={{
              display: "grid",
              gridTemplateColumns:
                "1.2fr .9fr 1fr 1fr .9fr .45fr .45fr .8fr .9fr .9fr 32px",
              gap: "10px",
              alignItems: "center",
              padding: "12px 12px",
              background: "#f4f7f9",
              borderTop: "2px solid #e2e5e8",
              fontSize: "10px",
              fontWeight: 700,
              color: "#222",
            }}
          >
            <span style={{ gridColumn: "1 / span 8" }}>
              Total
            </span>

            <strong>
              {units
                .reduce(
                  (total, unit) =>
                    total + (Number(unit.discountable) || 0),
                  0
                )
                .toLocaleString("en-GB", {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2,
                })}
            </strong>

            <strong>
              {units
                .reduce(
                  (total, unit) =>
                    total + (Number(unit.nonDiscountable) || 0),
                  0
                )
                .toLocaleString("en-GB", {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2,
                })}
            </strong>

            <span />
          </div>
'''

          text = text[:table_end] + marker + text[table_end:]
          path.write_text(text, encoding='utf-8')
          print('Totals row inserted')

      - name: Commit totals row
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/WindowCosting.jsx
          git commit -m "fix: show window costing totals row"
          git push origin main

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-window-totals.yml
          git commit -m "chore: remove temporary totals workflow"
          git push origin main
